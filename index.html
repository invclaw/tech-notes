<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Notes · 体系化技术知识库</title>
  <meta name="description" content="项目源码分析、核心技术细节讨论沉淀与体系化知识图谱。" />
  <link rel="stylesheet" href="./assets/app.css?v=4" />
  <link id="hljs-theme-light" rel="stylesheet" href="./vendor/github.min.css" />
  <link id="hljs-theme-dark" rel="stylesheet" href="./vendor/github-dark.min.css" disabled />
</head>
<body>
  <div class="app-shell">
    <!-- Mobile top bar -->
    <header class="mobile-header">
      <button id="menu-toggle" class="icon-btn" aria-label="打开导航">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <a class="mobile-brand" href="#/">Tech Notes</a>
      <button id="mobile-search-btn" class="icon-btn" aria-label="搜索">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </header>

    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <!-- Left Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="知识库导航">
      <div class="sidebar-top">
        <a href="#/" class="brand" id="brand-link">
          <span class="brand-mark">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <line x1="9" y1="7" x2="16" y2="7"></line>
              <line x1="9" y1="11" x2="14" y2="11"></line>
            </svg>
          </span>
          <span class="brand-text">
            <strong id="site-title">Tech Notes</strong>
            <small id="site-subtitle">体系化技术知识沉淀</small>
          </span>
        </a>
        <button id="theme-toggle" class="icon-btn" title="切换明暗主题" aria-label="切换明暗主题">
          <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="12" y1="2" x2="12" y2="4"></line>
            <line x1="12" y1="20" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
            <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="4" y2="12"></line>
            <line x1="20" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
            <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
          </svg>
          <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>

      <button id="search-trigger" class="search-trigger" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>搜索项目、知识点、标签…</span>
        <kbd>⌘K</kbd>
      </button>

      <nav id="sidebar-nav" class="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <span id="sidebar-stats">加载中…</span>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-wrap">
      <div class="content-grid">
        <article class="doc-article" id="doc-container">
          <div class="loading-state">正在加载知识库内容…</div>
        </article>

        <!-- Right Sticky TOC -->
        <aside class="toc-aside" id="toc-aside" aria-label="页面目录">
          <div class="toc-inner">
            <div class="toc-title">本页目录</div>
            <nav id="toc-nav" class="toc-nav"></nav>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <!-- Search Modal -->
  <div id="search-modal" class="modal-overlay" hidden>
    <div class="search-dialog" role="dialog" aria-modal="true" aria-label="站内搜索">
      <div class="search-input-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search-input" type="text" placeholder="输入关键词搜索标题、正文、标签…" autocomplete="off" />
        <kbd class="esc-hint">ESC</kbd>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <!-- Image / Diagram Lightbox -->
  <div id="lightbox" class="lightbox-overlay" hidden>
    <div class="lightbox-toolbar">
      <span id="lightbox-caption" class="lightbox-caption"></span>
      <div class="lightbox-actions">
        <button id="lightbox-zoom-out" class="lb-btn" type="button" title="缩小">−</button>
        <span id="lightbox-zoom-label" class="lb-zoom-label">100%</span>
        <button id="lightbox-zoom-in" class="lb-btn" type="button" title="放大">+</button>
        <button id="lightbox-zoom-reset" class="lb-btn" type="button" title="重置缩放">重置</button>
        <button id="lightbox-close" class="lb-btn lb-close" type="button" aria-label="关闭大图">×</button>
      </div>
    </div>
    <div id="lightbox-body" class="lightbox-body"></div>
  </div>

  <script src="./vendor/marked.min.js"></script>
  <script src="./vendor/highlight.min.js"></script>
  <script src="./vendor/mermaid.min.js"></script>
  <script src="./assets/app.js?v=4"></script>
</body>
</html>
