<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" role="img" aria-label="Browser Use 与 Computer Use 架构与闭环对比图">
  <defs>
    <linearGradient id="gui-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="gui-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="gui-arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <filter id="gui-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="980" height="460" rx="14" fill="url(#gui-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">GUI 自动化双路线：Browser Use（结构化网页）vs Computer Use（全桌面像素）</text>

  <!-- Left: Browser Use -->
  <g filter="url(#gui-shadow)">
    <rect x="24" y="56" width="452" height="380" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8"/>
    <rect x="24" y="56" width="452" height="34" rx="12" fill="#2563eb"/>
    <rect x="24" y="78" width="452" height="12" fill="#2563eb"/>
    <text x="250" y="78" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">Browser Use（浏览器级 · 结构化优先）</text>

    <rect x="44" y="106" width="412" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="58" y="127" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">1. 感知（Perception）：AXTree 无障碍树 + 可选标注截图</text>
    <text x="58" y="147" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 提取可交互节点（button / textbox / link）分配短编号 ref=e12</text>
    <text x="58" y="163" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 相比原始 HTML 省 90%+ Token，结构清晰</text>

    <line x1="250" y1="172" x2="250" y2="196" stroke="#2563eb" stroke-width="2" marker-end="url(#gui-arr-blue)"/>

    <rect x="44" y="202" width="412" height="66" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="58" y="223" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">2. 动作（Action）：语义元素操作（经 CDP / Playwright）</text>
    <text x="58" y="243" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• click(ref="e12") · fill(ref="e7", "...") · navigate(url)</text>
    <text x="58" y="259" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 不依赖屏幕分辨率，自动等待元素可见与加载</text>

    <line x1="250" y1="268" x2="250" y2="292" stroke="#2563eb" stroke-width="2" marker-end="url(#gui-arr-blue)"/>

    <rect x="44" y="298" width="412" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="58" y="319" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">3. 运行载体：独立 Chromium 容器 / Playwright MCP</text>
    <text x="58" y="339" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 隔离 Cookie 与登录态，可随时返回最新 AXTree + URL 验证</text>

    <rect x="44" y="372" width="412" height="48" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="250" y="393" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">适用：Web 表单、后台管理、检索抓取、SaaS 业务流程</text>
    <text x="250" y="410" text-anchor="middle" fill="#1d4ed8" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">快、准、省 Token · 无法操作浏览器之外的桌面软件</text>
  </g>

  <!-- Right: Computer Use -->
  <g filter="url(#gui-shadow)">
    <rect x="504" y="56" width="452" height="380" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
    <rect x="504" y="56" width="452" height="34" rx="12" fill="#7c3aed"/>
    <rect x="504" y="78" width="452" height="12" fill="#7c3aed"/>
    <text x="730" y="78" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">Computer Use（全桌面级 · 视觉像素通用）</text>

    <rect x="524" y="106" width="412" height="66" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
    <text x="538" y="127" fill="#4c1d95" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">1. 感知（Perception）：整屏截图（缩放归一化）+ 可选 OS 控件树</text>
    <text x="538" y="147" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 捕获整块虚拟/物理屏幕像素（如 1280×800）送入多模态模型</text>
    <text x="538" y="163" fill="#7c3aed" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 不挑应用类型，所见即所得（Canvas / 弹窗 / 原生 App 全覆盖）</text>

    <line x1="730" y1="172" x2="730" y2="196" stroke="#7c3aed" stroke-width="2" marker-end="url(#gui-arr-purple)"/>

    <rect x="524" y="202" width="412" height="66" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="538" y="223" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">2. 动作（Action）：底层键鼠坐标注入</text>
    <text x="538" y="243" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• left_click(x=640, y=420) · type("...") · key("ctrl+s") · scroll</text>
    <text x="538" y="259" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 经 xdotool/uinput（Linux）、CGEvent（macOS）、SendInput（Win）</text>

    <line x1="730" y1="268" x2="730" y2="292" stroke="#7c3aed" stroke-width="2" marker-end="url(#gui-arr-purple)"/>

    <rect x="524" y="298" width="412" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="538" y="319" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">3. 运行载体：虚拟桌面（Xvfb/Wayland）+ noVNC/WebRTC</text>
    <text x="538" y="339" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 人类可实时观看画面并在 2FA / 验证码 / 支付时一键接管</text>

    <rect x="524" y="372" width="412" height="48" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="730" y="393" text-anchor="middle" fill="#4c1d95" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">适用：桌面软件（Excel / IDE / 客户端）、跨应用流程、无 API 系统</text>
    <text x="730" y="410" text-anchor="middle" fill="#6d28d9" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">通用性最强 · 图片 Token 贵、慢、易受坐标偏移影响</text>
  </g>
</svg>
