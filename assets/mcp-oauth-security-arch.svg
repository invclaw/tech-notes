<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-label="MCP 生产级治理架构：OAuth 2.1 CIMD 鉴权链路、Schema 膨胀治理与六大安全防线">
  <defs>
    <linearGradient id="mo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="mo-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="mo-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="980" height="480" rx="14" fill="url(#mo-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">MCP 生产治理全景：OAuth 2.1（CIMD）鉴权链路、Schema 膨胀治理与安全防线</text>

  <!-- Top: OAuth 2.1 Chain -->
  <g filter="url(#mo-shadow)">
    <rect x="24" y="54" width="932" height="162" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="24" y="54" width="932" height="30" rx="12" fill="#2563eb"/>
    <rect x="24" y="72" width="932" height="12" fill="#2563eb"/>
    <text x="490" y="74" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">远程 MCP OAuth 2.1 生产鉴权链路（RFC 9728 + CIMD + PKCE S256 + RFC 8707 + RFC 9207）</text>

    <rect x="38" y="96" width="196" height="106" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="136" y="115" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">1. 资源发现（RFC 9728）</text>
    <text x="48" y="134" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">• 未认证返回 401 +</text>
    <text x="48" y="149" fill="#2563eb" font-family="Menlo,monospace" font-size="9">  resource_metadata</text>
    <text x="48" y="166" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">• 探测受保护资源元数据，</text>
    <text x="48" y="181" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">  定位 AS（RFC 8414/OIDC）</text>

    <line x1="236" y1="149" x2="256" y2="149" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mo-arrow)"/>

    <rect x="262" y="96" width="206" height="106" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="365" y="115" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">2. 客户端身份（CIMD）</text>
    <text x="272" y="134" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">• 用 HTTPS URL 作 client_id</text>
    <text x="272" y="149" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">• AS 拉取客户端元数据 JSON</text>
    <text x="272" y="166" fill="#dc2626" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">• 2026-07-28 正式弃用 DCR</text>
    <text x="272" y="181" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.6">  (RFC 7591 仅作兼容回退)</text>

    <line x1="470" y1="149" x2="490" y2="149" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mo-arrow)"/>

    <rect x="496" y="96" width="212" height="106" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="602" y="115" text-anchor="middle" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">3. 授权与防 Mix-Up</text>
    <text x="506" y="134" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">• 强制 PKCE S256（缺即拒）</text>
    <text x="506" y="149" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">• 强制带 resource=MCP URI</text>
    <text x="506" y="166" fill="#6d28d9" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">• 逐字校验 RFC 9207 iss 参数</text>
    <text x="506" y="181" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.6">• 遇 403 触发 Step-Up 增量授权</text>

    <line x1="710" y1="149" x2="730" y2="149" stroke="#2563eb" stroke-width="1.8" marker-end="url(#mo-arrow)"/>

    <rect x="736" y="96" width="206" height="106" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="839" y="115" text-anchor="middle" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">4. 受众校验与禁透传</text>
    <text x="746" y="134" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">• 严验 Token audience==自身</text>
    <text x="746" y="149" fill="#dc2626" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">• 明令禁止 Token Passthrough</text>
    <text x="746" y="166" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">• 调上游 API 须另行 OAuth</text>
    <text x="746" y="181" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.6">  （推荐 URL Mode Elicitation）</text>
  </g>

  <!-- Bottom Left: Tool Schema Bloat & Prompt Cache -->
  <g filter="url(#mo-shadow)">
    <rect x="24" y="234" width="446" height="228" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="24" y="234" width="446" height="30" rx="12" fill="#0f766e"/>
    <rect x="24" y="252" width="446" height="12" fill="#0f766e"/>
    <text x="247" y="254" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">工程难题 1 · MCP Tool Schema 膨胀与缓存治理</text>

    <rect x="40" y="276" width="414" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="52" y="295" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">痛点：挂载 10 个 MCP Server = 上百个工具 = 20K–40K 输入 Token</text>
    <text x="52" y="313" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">直接撑爆上下文预算、稀释工具选择精度；工具列表乱序还会击穿 Prefix Cache</text>

    <rect x="40" y="336" width="414" height="112" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="52" y="355" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">四大工业级治理范式：</text>
    <text x="52" y="374" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">1. 延迟检索激活：tool_search 仅放极简目录，按需加载完整 Schema</text>
    <text x="52" y="392" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">2. 确定性排序：MCP 规范要求 tools/list 稳定排序 + CacheableResult</text>
    <text x="52" y="410" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">3. Code Mode / PTC：用沙箱脚本编排批量调用，避开高频 Schema 往返</text>
    <text x="52" y="428" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">4. 零前缀污染：工具热插拔改用增量 Delta 或带外通道，严守缓存边界</text>
  </g>

  <!-- Bottom Right: 6 Threats & Defenses -->
  <g filter="url(#mo-shadow)">
    <rect x="490" y="234" width="466" height="228" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="490" y="234" width="466" height="30" rx="12" fill="#dc2626"/>
    <rect x="490" y="252" width="466" height="12" fill="#dc2626"/>
    <text x="723" y="254" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">工程难题 2 · MCP 核心威胁矩阵与纵深防线</text>

    <rect x="506" y="276" width="212" height="80" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="516" y="294" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" font-weight="700">Tool Poisoning / Shadowing</text>
    <text x="516" y="311" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">描述文本藏隐蔽指令，甚至劫持</text>
    <text x="516" y="326" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">模型误调其他高危 Server 工具</text>
    <text x="516" y="344" fill="#b91c1c" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.6">防线：Annotations 不可信 + HITL</text>

    <rect x="728" y="276" width="212" height="80" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="738" y="294" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" font-weight="700">Rug Pull（静默变脸）</text>
    <text x="738" y="311" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">Server 过审后悄然篡改工具描述</text>
    <text x="738" y="326" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">或参数定义窃取凭据</text>
    <text x="738" y="344" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.6">防线：工具定义哈希钉扎重审</text>

    <rect x="506" y="366" width="212" height="82" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="516" y="384" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" font-weight="700">Confused Deputy &amp; SSRF</text>
    <text x="516" y="401" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">代理跳板劫持第三方同意页；</text>
    <text x="516" y="416" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">恶意 CIMD/元数据探针打内网</text>
    <text x="516" y="434" fill="#6d28d9" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.6">防线：独立同意页 + DNS Pinning</text>

    <rect x="728" y="366" width="212" height="82" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="738" y="384" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" font-weight="700">本地 stdio 零隔离与宿主机穿透</text>
    <text x="738" y="401" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">stdio 子进程共享宿主机权限；</text>
    <text x="738" y="416" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">沙箱内 Agent 跨界调宿主机 MCP</text>
    <text x="738" y="434" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.6">防线：沙箱隔离 + 二次白名单审批</text>
  </g>
</svg>
