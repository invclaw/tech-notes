<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="Codex 压缩前与压缩后上下文窗口具体实例对照图">
  <defs>
    <linearGradient id="ce-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="ce-arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="ce-arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="ce-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="ce-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="ce-arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <filter id="ce-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="980" height="560" rx="14" fill="url(#ce-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">实例对照：一次真实排障会话在「压缩前 vs 压缩后」到底保留了什么、丢弃了什么？</text>

  <!-- LEFT: BEFORE COMPACTION -->
  <rect x="24" y="54" width="388" height="482" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="24" y="54" width="388" height="32" rx="12" fill="#334155"/>
  <rect x="24" y="74" width="388" height="12" fill="#334155"/>
  <text x="218" y="75" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">压缩前：旧上下文窗口（快塞满 · ~180K tokens）</text>

  <!-- L1: Base prefix -->
  <g filter="url(#ce-shadow)">
    <rect x="40" y="98" width="356" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="52" y="118" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">[系统稳定前缀] 基础指令 + 工具定义</text>
    <text x="52" y="135" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">跨轮不变的内容</text>
  </g>

  <!-- L2: Stale WorldState -->
  <g filter="url(#ce-shadow)">
    <rect x="40" y="154" width="356" height="48" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="4 3"/>
    <text x="52" y="174" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">[旧 WorldState] 1 小时前的分支与文件树</text>
    <text x="52" y="192" fill="#b91c1c" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">已过时（直接丢弃，按当前最新重算）</text>
  </g>

  <!-- L3: Massive old turns -->
  <g filter="url(#ce-shadow)">
    <rect x="40" y="212" width="356" height="106" rx="8" fill="#fee2e2" stroke="#f87171" stroke-width="1.4"/>
    <text x="52" y="233" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">[早期过程日志 × 40 轮]（占 85% 体积）</text>
    <text x="52" y="253" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 用户 1：“帮我排查登录接口 500 报错”</text>
    <text x="52" y="271" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 连续读 15 个源码文件 + 8 次冗长测试日志</text>
    <text x="52" y="289" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 中间试错 diff + 2 张超预算早期报错截图</text>
    <text x="52" y="307" fill="#dc2626" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" font-weight="600">→ 原始冗长日志全部丢弃，浓缩成 1 条摘要</text>
  </g>

  <!-- L4: Retained tool output -->
  <g filter="url(#ce-shadow)">
    <rect x="40" y="328" width="356" height="48" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="52" y="348" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">[跨窗保留工具输出] 关键环境检查 / 宿主规范</text>
    <text x="52" y="366" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">显式标记跨窗口保留，跳过压缩</text>
  </g>

  <!-- L5: Recent User Message -->
  <g filter="url(#ce-shadow)">
    <rect x="40" y="386" width="356" height="58" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="52" y="406" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">[近期真实用户消息]（20K / 64K 预算内）</text>
    <text x="52" y="424" fill="#78350f" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">“不要改表结构，只修鉴权中间件，并补齐单测”</text>
    <text x="52" y="438" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">原话保留，绝不让二次摘要扭曲核心约束</text>
  </g>

  <!-- L6: Pending Mail -->
  <g filter="url(#ce-shadow)">
    <rect x="40" y="454" width="356" height="64" rx="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="52" y="474" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">[挂起未处理输入 Pending Mail]</text>
    <text x="52" y="493" fill="#4c1d95" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">压缩瞬间刚到：“对了，把错误码统一改成 401”</text>
    <text x="52" y="509" fill="#7c3aed" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">尚未回应，必须保留在摘要之后</text>
  </g>

  <!-- MIDDLE ARROWS WITH LABELS -->
  <!-- 1 -> 1 -->
  <line x1="396" y1="121" x2="562" y2="121" stroke="#475569" stroke-width="2" marker-end="url(#ce-arr-slate)"/>
  <rect x="434" y="109" width="90" height="22" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="479" y="124" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" font-weight="600">原样置顶</text>

  <!-- 2 -> 2 -->
  <line x1="396" y1="178" x2="562" y2="178" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ce-arr-green)"/>
  <rect x="430" y="166" width="98" height="22" rx="5" fill="#dcfce7" stroke="#86efac"/>
  <text x="479" y="181" text-anchor="middle" fill="#166534" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" font-weight="600">弃旧重算</text>

  <!-- 3 -> 3 -->
  <line x1="396" y1="265" x2="562" y2="265" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ce-arr-blue)"/>
  <rect x="424" y="253" width="110" height="22" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="479" y="268" text-anchor="middle" fill="#1e40af" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" font-weight="600">压缩成 1 条摘要</text>

  <!-- 4 & 5 -> 4 -->
  <path d="M 396 352 L 420 352 L 420 385 L 562 385" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#ce-arr-amber)"/>
  <path d="M 396 415 L 420 415 L 420 385" fill="none" stroke="#d97706" stroke-width="2"/>
  <rect x="432" y="373" width="94" height="22" rx="5" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="479" y="388" text-anchor="middle" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" font-weight="600">原样硬保留</text>

  <!-- 6 -> 5 -->
  <line x1="396" y1="486" x2="562" y2="486" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#ce-arr-purple)"/>
  <rect x="424" y="474" width="110" height="22" rx="5" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="479" y="489" text-anchor="middle" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" font-weight="600">摘要后原序归位</text>

  <!-- RIGHT: AFTER COMPACTION -->
  <rect x="568" y="54" width="388" height="482" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <rect x="568" y="54" width="388" height="32" rx="12" fill="#0f766e"/>
  <rect x="568" y="74" width="388" height="12" fill="#0f766e"/>
  <text x="762" y="75" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">压缩后：新上下文窗口（瘦身至 ~12K tokens）</text>

  <!-- R1 -->
  <g filter="url(#ce-shadow)">
    <rect x="584" y="98" width="356" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="596" y="118" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">① 稳定前缀（字节不变，吃满 Prompt Cache）</text>
    <text x="596" y="135" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">基础指令 + 工具定义原样置顶</text>
  </g>

  <!-- R2 -->
  <g filter="url(#ce-shadow)">
    <rect x="584" y="154" width="356" height="48" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.4"/>
    <text x="596" y="174" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">② 最新 WorldState（此刻最新环境基线）</text>
    <text x="596" y="192" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">当前最新分支、工作区状态、工具与角色名录</text>
  </g>

  <!-- R3 -->
  <g filter="url(#ce-shadow)">
    <rect x="584" y="212" width="356" height="106" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="596" y="233" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">③ 压缩摘要 / 服务端压缩态（仅 1 条）</text>
    <text x="596" y="254" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">“已定位登录 500 源于 token 过期未捕获；</text>
    <text x="596" y="272" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">已修改 auth.ts 鉴权中间件；下一步补单测。”</text>
    <text x="596" y="294" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">（40 轮读文件与冗长报错日志已全部释放）</text>
  </g>

  <!-- R4 -->
  <g filter="url(#ce-shadow)">
    <rect x="584" y="328" width="356" height="116" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="596" y="349" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">④ 跨窗口硬保留物（原样带入，零失真）</text>
    <text x="596" y="370" fill="#78350f" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 关键环境检查 / 宿主规范（跨窗保留输出）</text>
    <text x="596" y="390" fill="#78350f" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 用户原话：“不要改表结构，只修鉴权中间件，</text>
    <text x="606" y="407" fill="#78350f" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">并补齐单测”</text>
    <text x="596" y="430" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 过期/超预算大图已裁剪，不占新窗额度</text>
  </g>

  <!-- R5 -->
  <g filter="url(#ce-shadow)">
    <rect x="584" y="454" width="356" height="64" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="596" y="474" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">⑤ 挂起未处理输入（置于摘要之后）</text>
    <text x="596" y="493" fill="#4c1d95" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">“对了，把错误码统一改成 401”</text>
    <text x="596" y="509" fill="#7c3aed" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">下一轮推理立刻响应，不漏答、不重复</text>
  </g>
</svg>
