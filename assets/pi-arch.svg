<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" role="img" aria-label="Pi (earendil-works/pi) 分层极简架构与树形会话全景图">
  <defs>
    <linearGradient id="pi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="pi-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <filter id="pi-shadow" x="-3%" y="-6%" width="106%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="980" height="460" rx="14" fill="url(#pi-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">Pi 整体架构：极简可组装底座 · 树形会话 · 外置隔离边界</text>

  <!-- Layer 1: 4 Interfaces -->
  <g filter="url(#pi-shadow)">
    <rect x="28" y="56" width="924" height="68" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
    <rect x="28" y="56" width="146" height="68" rx="10" fill="#1e293b"/>
    <rect x="162" y="56" width="12" height="68" fill="#1e293b"/>
    <text x="101" y="86" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">四种消费形态</text>
    <text x="101" y="105" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">共享同一内核</text>

    <rect x="190" y="68" width="170" height="44" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="275" y="94" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="600">TUI 差分渲染终端</text>

    <rect x="376" y="68" width="166" height="44" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="459" y="94" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="600">Print / JSON 模式</text>

    <rect x="558" y="68" width="178" height="44" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="647" y="94" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="600">JSONL stdin/stdout RPC</text>

    <rect x="752" y="68" width="184" height="44" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="844" y="94" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="600">进程内 TypeScript SDK</text>
  </g>

  <line x1="490" y1="124" x2="490" y2="148" stroke="#475569" stroke-width="2" marker-end="url(#pi-arr)"/>

  <!-- Layer 2: Coding-Agent + Extensions + Tree Session -->
  <g filter="url(#pi-shadow)">
    <rect x="28" y="154" width="924" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="28" y="154" width="146" height="96" rx="10" fill="#2563eb"/>
    <rect x="162" y="154" width="12" height="96" fill="#2563eb"/>
    <text x="101" y="198" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">Coding Agent 层</text>
    <text x="101" y="218" text-anchor="middle" fill="#dbeafe" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">极简高可塑</text>

    <rect x="190" y="168" width="234" height="68" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="204" y="190" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">树形 JSONL 会话存储</text>
    <text x="204" y="210" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">id/parentId 树 · /tree 原地分叉</text>
    <text x="204" y="226" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">切分支自动生成 Branch Summary</text>

    <rect x="438" y="168" width="244" height="68" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="452" y="190" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">追加式压缩（非破坏）</text>
    <text x="452" y="210" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">CompactionEntry + firstKeptEntryId</text>
    <text x="452" y="226" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">支持超长单轮切分 · 摘要关缓存写</text>

    <rect x="696" y="168" width="240" height="68" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="710" y="190" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">全权 TS 扩展与资源包</text>
    <text x="710" y="210" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">Extensions · Skills · Templates</text>
    <text x="710" y="226" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">无内置 Plan/Subagent，全按需装</text>
  </g>

  <line x1="490" y1="250" x2="490" y2="274" stroke="#475569" stroke-width="2" marker-end="url(#pi-arr)"/>

  <!-- Layer 3: Reusable Core Libraries -->
  <g filter="url(#pi-shadow)">
    <rect x="28" y="280" width="924" height="72" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
    <rect x="28" y="280" width="146" height="72" rx="10" fill="#0f766e"/>
    <rect x="162" y="280" width="12" height="72" fill="#0f766e"/>
    <text x="101" y="312" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">可复用内核库</text>
    <text x="101" y="331" text-anchor="middle" fill="#ccfbf1" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">独立 npm 包矩阵</text>

    <rect x="190" y="294" width="170" height="44" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="275" y="320" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="600">pi-agent-core 循环状态</text>

    <rect x="376" y="294" width="166" height="44" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="459" y="320" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="600">pi-ai 多模型统一层</text>

    <rect x="558" y="294" width="178" height="44" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="647" y="320" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="600">pi-durable 持久运行时</text>

    <rect x="752" y="294" width="184" height="44" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="844" y="320" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="600">chord 跨进程对象同步</text>
  </g>

  <line x1="490" y1="352" x2="490" y2="376" stroke="#475569" stroke-width="2" marker-end="url(#pi-arr)"/>

  <!-- Layer 4: External Isolation & Supply Chain -->
  <g filter="url(#pi-shadow)">
    <rect x="28" y="382" width="924" height="60" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="28" y="382" width="146" height="60" rx="10" fill="#7c3aed"/>
    <rect x="162" y="382" width="12" height="60" fill="#7c3aed"/>
    <text x="101" y="408" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">外置隔离与信任</text>
    <text x="101" y="427" text-anchor="middle" fill="#ede9fe" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">不内置权限弹窗</text>

    <text x="196" y="407" fill="#4c1d95" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">项目信任判定 + 4 种外置容器/微虚机隔离模式 + 供应链零脚本加固</text>
    <text x="196" y="427" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">Plain Docker · Docker Sandboxes（宿主机代理代换密钥）· OpenShell · Gondolin（仅工具进本地 MicroVM）</text>
  </g>
</svg>
