<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="OpenClaw 分层记忆、更新机制与双车道召回架构图">
  <defs>
    <linearGradient id="mem-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="m-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="m-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="m-arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="m-arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <filter id="m-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="980" height="540" rx="14" fill="url(#mem-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">OpenClaw 记忆全景：六类载体 · 异步晋升更新 · 双车道召回</text>

  <!-- Column 1: 6 Memory Types -->
  <rect x="24" y="54" width="290" height="464" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="24" y="54" width="290" height="30" rx="12" fill="#1e293b"/>
  <rect x="24" y="72" width="290" height="12" fill="#1e293b"/>
  <text x="169" y="74" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">一、记忆分层（存什么）</text>

  <!-- 1. Instructions -->
  <g filter="url(#m-shadow)">
    <rect x="38" y="96" width="262" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="50" y="116" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">1. 指令层（Instructions）</text>
    <text x="50" y="137" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">行为宪法与工作规范 · 仅人类修改</text>
  </g>

  <!-- 2. Curated Facts -->
  <g filter="url(#m-shadow)">
    <rect x="38" y="162" width="262" height="62" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="50" y="182" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">2. 长期事实记忆（MEMORY）</text>
    <text x="50" y="201" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">经验证的稳定事实、决策、踩坑经验</text>
    <text x="50" y="216" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">支持触发短语 · 重要度 · 项目作用域</text>
  </g>

  <!-- 3. User Model -->
  <g filter="url(#m-shadow)">
    <rect x="38" y="234" width="262" height="62" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
    <text x="50" y="254" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">3. 用户偏好模型（USER）</text>
    <text x="50" y="273" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">祈使句偏好、沟通风格、人际与关注项</text>
    <text x="50" y="288" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">原地覆盖更新 · 支持共享+个人叠加</text>
  </g>

  <!-- 4. Episodic -->
  <g filter="url(#m-shadow)">
    <rect x="38" y="306" width="262" height="62" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="50" y="326" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">4. 情景日志层（Episodic）</text>
    <text x="50" y="345" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">每日工作笔记 + 原始会话记录</text>
    <text x="50" y="360" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">体量大、追加写入 · 禁止自动注入</text>
  </g>

  <!-- 5. Prospective -->
  <g filter="url(#m-shadow)">
    <rect x="38" y="378" width="262" height="62" rx="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="50" y="398" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">5. 前瞻意图层（Prospective）</text>
    <text x="50" y="417" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">时间触发→Cron · 事件触发→常驻意图</text>
    <text x="50" y="432" fill="#7c3aed" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">显式状态机 · 冷却/次数/有效期硬限</text>
  </g>

  <!-- 6. Review -->
  <g filter="url(#m-shadow)">
    <rect x="38" y="450" width="262" height="54" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="50" y="470" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">6. 人工审阅层（梦境日记）</text>
    <text x="50" y="491" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">整理摘要与修改前快照 · 永不注入模型</text>
  </g>

  <!-- Column 2: Update & Consolidation Pipeline -->
  <rect x="346" y="54" width="308" height="464" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="346" y="54" width="308" height="30" rx="12" fill="#0f766e"/>
  <rect x="346" y="72" width="308" height="12" fill="#0f766e"/>
  <text x="500" y="74" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">二、更新与安全晋升（如何更新）</text>

  <!-- Hot write path -->
  <g filter="url(#m-shadow)">
    <rect x="362" y="98" width="276" height="92" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="376" y="119" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">热路径轻量落盘（不阻塞回复）</text>
    <text x="376" y="140" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">• 对话中追加每日笔记</text>
    <text x="376" y="159" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">• 压缩前预刷写（防摘要丢事实）</text>
    <text x="376" y="178" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">• 会话结束自动采集 + 打血缘标签</text>
  </g>

  <line x1="500" y1="190" x2="500" y2="216" stroke="#0f766e" stroke-width="2" marker-end="url(#m-arr-teal)"/>

  <!-- Dreaming 3 phases -->
  <g filter="url(#m-shadow)">
    <rect x="362" y="222" width="276" height="198" rx="9" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
    <text x="500" y="244" text-anchor="middle" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">后台 Dreaming 三阶段整理</text>

    <rect x="376" y="256" width="248" height="42" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="388" y="274" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">① Light（浅睡）：去重、暂存候选</text>
    <text x="388" y="290" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">只记录强化信号，不改写长期记忆</text>

    <rect x="376" y="306" width="248" height="42" rx="6" fill="#ffffff" stroke="#99f6e4"/>
    <text x="388" y="324" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">② REM（反思）：提炼跨日主题规律</text>
    <text x="388" y="340" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">汇总模式与关联，仍不改写长期记忆</text>

    <rect x="376" y="356" width="248" height="52" rx="6" fill="#ffffff" stroke="#14b8a6" stroke-width="1.4"/>
    <text x="388" y="374" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">③ Deep（深睡晋升）：两道闸门</text>
    <text x="388" y="391" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">规则门控剔除不可信 → 模型合并/覆盖旧事实</text>
    <text x="388" y="404" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">乐观并发原子写入 + 保留快照写日记</text>
  </g>

  <!-- Provenance Shield -->
  <g filter="url(#m-shadow)">
    <rect x="362" y="434" width="276" height="70" rx="9" fill="#fef2f2" stroke="#f87171" stroke-width="1.4"/>
    <text x="376" y="455" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">写路径安全栅栏（防投毒 / 防闭环）</text>
    <text x="376" y="474" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 结构化血缘分级 · 网络工具轮次污点传播</text>
    <text x="376" y="492" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 后台会话禁入 · 召回片段永不二次学习</text>
  </g>

  <!-- Arrows between Col 1 & Col 2 -->
  <line x1="300" y1="336" x2="358" y2="144" stroke="#d97706" stroke-width="1.6" marker-end="url(#m-arr-amber)"/>
  <line x1="362" y1="378" x2="304" y2="196" stroke="#0f766e" stroke-width="1.8" marker-end="url(#m-arr-teal)"/>

  <!-- Column 3: Two-lane Recall -->
  <rect x="686" y="54" width="270" height="464" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="686" y="54" width="270" height="30" rx="12" fill="#2563eb"/>
  <rect x="686" y="72" width="270" height="12" fill="#2563eb"/>
  <text x="821" y="74" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">三、双车道召回（如何消费）</text>

  <!-- Lane 1 -->
  <g filter="url(#m-shadow)">
    <rect x="702" y="98" width="238" height="194" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="716" y="120" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">车道 1：常驻快车道（零模型调用）</text>
    <text x="716" y="144" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="600">• 启动注入</text>
    <text x="726" y="161" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">仅加载过审的核心事实与用户偏好</text>
    <text x="716" y="184" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="600">• 加权排序检索</text>
    <text x="726" y="201" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">相关性 × 时间衰减 × 重要度</text>
    <text x="716" y="224" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="600">• 触发词 / 意图预过滤</text>
    <text x="726" y="241" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">命中精选触发词或常驻意图时</text>
    <text x="726" y="256" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">悄然注入少量隐藏上下文</text>
    <text x="716" y="279" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">⚡ 零延迟 · 故障降级不阻断回复</text>
  </g>

  <line x1="821" y1="292" x2="821" y2="320" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#m-arr-purple)"/>
  <text x="821" y="311" text-anchor="middle" fill="#6d28d9" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5" font-weight="600">有回忆意图且车道 1 未强命中</text>

  <!-- Lane 2 -->
  <g filter="url(#m-shadow)">
    <rect x="702" y="326" width="238" height="104" rx="9" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="716" y="348" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">车道 2：按需升级（深度召回）</text>
    <text x="716" y="370" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 启动独立召回子 Agent</text>
    <text x="716" y="389" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 专攻跨时间、多跳推理、跨会话回溯</text>
    <text x="716" y="408" fill="#7c3aed" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">把模型耗时精准花在疑难回忆上</text>
  </g>

  <!-- Project Scope -->
  <g filter="url(#m-shadow)">
    <rect x="702" y="442" width="238" height="62" rx="9" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="716" y="463" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">项目作用域边界</text>
    <text x="716" y="482" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">按代码仓库提升当前经验、降权异库经验</text>
    <text x="716" y="496" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">（用户偏好与常驻意图始终全局生效）</text>
  </g>

  <!-- Connecting arrow from Col 2 to Col 3 -->
  <line x1="654" y1="190" x2="698" y2="190" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-arr-blue)"/>
</svg>
