<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-label="Agent 与四类沙箱的底层交互链路对比图">
  <defs>
    <linearGradient id="ix-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="ix-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <filter id="ix-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="980" height="480" rx="14" fill="url(#ix-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">Agent 与沙箱到底怎么交互？四类沙箱的通信通道对比</text>

  <!-- Left: Agent Runtime -->
  <g filter="url(#ix-shadow)">
    <rect x="24" y="64" width="210" height="390" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="24" y="64" width="210" height="32" rx="12" fill="#2563eb"/>
    <rect x="24" y="84" width="210" height="12" fill="#2563eb"/>
    <text x="129" y="85" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">Agent 运行时（控制面）</text>

    <rect x="38" y="114" width="182" height="68" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="129" y="138" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">大模型产出工具调用</text>
    <text x="129" y="159" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">exec / read / write / run_code</text>

    <rect x="38" y="202" width="182" height="78" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="129" y="226" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">Tool Router &amp; 策略检查</text>
    <text x="129" y="246" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">鉴权 · 路径校验 · 超时控制</text>
    <text x="129" y="264" text-anchor="middle" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">（凭据永远留在这里）</text>

    <rect x="38" y="300" width="182" height="72" rx="8" fill="#ffffff" stroke="#93c5fd"/>
    <text x="129" y="324" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">收集执行结果</text>
    <text x="129" y="344" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">stdout / stderr / exitCode</text>
    <text x="129" y="360" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">截断脱敏后喂回下一轮模型</text>

    <text x="129" y="424" text-anchor="middle" fill="#1d4ed8" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="600">同一套 Tool 语义</text>
    <text x="129" y="441" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">按后端走不同物理通道 →</text>
  </g>

  <!-- 4 Horizontal Rows on Right -->
  <!-- Row 1: OS Process -->
  <line x1="234" y1="108" x2="302" y2="108" stroke="#2563eb" stroke-width="2" marker-end="url(#ix-arr)"/>
  <g filter="url(#ix-shadow)">
    <rect x="310" y="64" width="210" height="86" rx="9" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.4"/>
    <text x="415" y="88" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">通道 1：子进程管道 / PTY</text>
    <text x="415" y="109" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">spawn(sandbox-exec / bwrap)</text>
    <text x="415" y="128" text-anchor="middle" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">stdin / stdout / stderr 直连</text>
  </g>
  <line x1="520" y1="108" x2="564" y2="108" stroke="#2563eb" stroke-width="2" marker-end="url(#ix-arr)"/>
  <g filter="url(#ix-shadow)">
    <rect x="572" y="64" width="384" height="86" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="588" y="88" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">OS 进程级沙箱（Codex / Claude Code）</text>
    <text x="588" y="109" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 每条命令现拉现毁，文件直接读写本机工作区</text>
    <text x="588" y="128" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">• 无守护进程、无网络序列化，延迟最低（几毫秒）</text>
  </g>

  <!-- Row 2: Docker / Podman -->
  <line x1="234" y1="208" x2="302" y2="208" stroke="#2563eb" stroke-width="2" marker-end="url(#ix-arr)"/>
  <g filter="url(#ix-shadow)">
    <rect x="310" y="164" width="210" height="86" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="415" y="188" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">通道 2：docker exec + 挂载</text>
    <text x="415" y="209" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">命令走 Engine API / CLI</text>
    <text x="415" y="228" text-anchor="middle" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">文件走 Bind Mount 桥接校验</text>
  </g>
  <line x1="520" y1="208" x2="564" y2="208" stroke="#2563eb" stroke-width="2" marker-end="url(#ix-arr)"/>
  <g filter="url(#ix-shadow)">
    <rect x="572" y="164" width="384" height="86" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="588" y="188" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">本地容器沙箱（OpenClaw 默认 Docker/Podman）</text>
    <text x="588" y="209" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 先起长驻容器（sleep infinity），多轮复用免重复启动</text>
    <text x="588" y="228" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">• 每次工具调用用 exec 进入同一容器，空闲 15 分钟休眠</text>
  </g>

  <!-- Row 3: SSH / OpenShell -->
  <line x1="234" y1="308" x2="302" y2="308" stroke="#2563eb" stroke-width="2" marker-end="url(#ix-arr)"/>
  <g filter="url(#ix-shadow)">
    <rect x="310" y="264" width="210" height="86" rx="9" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.4"/>
    <text x="415" y="288" text-anchor="middle" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">通道 3：SSH 复用隧道</text>
    <text x="415" y="309" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">长连接复用转发命令与文件</text>
    <text x="415" y="328" text-anchor="middle" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">支持首次播种或双向同步</text>
  </g>
  <line x1="520" y1="308" x2="564" y2="308" stroke="#2563eb" stroke-width="2" marker-end="url(#ix-arr)"/>
  <g filter="url(#ix-shadow)">
    <rect x="572" y="264" width="384" height="86" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="588" y="288" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">远端主机 / 托管网关（SSH / OpenShell）</text>
    <text x="588" y="309" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 命令与文件工具经 SSH 桥接发往远端隔离环境执行</text>
    <text x="588" y="328" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">• OpenShell 额外支持执行前后把工作区自动镜像回本地</text>
  </g>

  <!-- Row 4: E2B Cloud MicroVM -->
  <line x1="234" y1="408" x2="302" y2="408" stroke="#2563eb" stroke-width="2" marker-end="url(#ix-arr)"/>
  <g filter="url(#ix-shadow)">
    <rect x="310" y="364" width="210" height="90" rx="9" fill="#fef2f2" stroke="#f87171" stroke-width="1.4"/>
    <text x="415" y="388" text-anchor="middle" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">通道 4：HTTPS / gRPC API</text>
    <text x="415" y="409" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">SDK → 云网关 → 内部 envd</text>
    <text x="415" y="428" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">流式输出 · 文件 · 端口预览</text>
  </g>
  <line x1="520" y1="408" x2="564" y2="408" stroke="#2563eb" stroke-width="2" marker-end="url(#ix-arr)"/>
  <g filter="url(#ix-shadow)">
    <rect x="572" y="364" width="384" height="90" rx="9" fill="#ffffff" stroke="#fca5a5"/>
    <text x="588" y="388" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">云端 MicroVM 平台（E2B / Daytona / Modal）</text>
    <text x="588" y="409" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• VM 内预装轻量守护进程（如 E2B envd）接管命令/文件/PTY</text>
    <text x="588" y="428" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">• 自带独立内核、快照百毫秒恢复、公网预览域名与自动计费回收</text>
  </g>
</svg>
