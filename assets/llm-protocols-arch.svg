<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" role="img" aria-label="三大主流大模型推理协议架构对比图">
  <defs>
    <linearGradient id="lp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="lp-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="980" height="460" rx="14" fill="url(#lp-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">大模型推理协议演进：从聊天补全到 Agent 原生协议</text>

  <!-- Col 1: OpenAI Chat Completions -->
  <g filter="url(#lp-shadow)">
    <rect x="24" y="56" width="296" height="380" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="24" y="56" width="296" height="34" rx="12" fill="#334155"/>
    <rect x="24" y="78" width="296" height="12" fill="#334155"/>
    <text x="172" y="78" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">OpenAI Chat Completions</text>

    <text x="40" y="114" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">定位：全行业最小公约数</text>
    <text x="40" y="133" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">Ollama / vLLM / 几乎所有开源与国产模型通用</text>

    <rect x="40" y="148" width="264" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="52" y="168" fill="#1e293b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">数据结构：无状态扁平消息</text>
    <text x="52" y="188" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• messages[] + tool_calls[] + role: tool</text>
    <text x="52" y="206" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 每轮客户端必须全量重传历史</text>
    <text x="52" y="222" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 流式仅推送 choices[0].delta 碎片</text>

    <rect x="40" y="242" width="264" height="84" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="52" y="262" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">长程 Agent 瓶颈</text>
    <text x="52" y="282" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 无原生加密思考块续接标准</text>
    <text x="52" y="300" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 无服务端压缩与上下文清理能力</text>
    <text x="52" y="316" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 自动缓存为主，缺乏精细控制</text>

    <rect x="40" y="338" width="264" height="80" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="52" y="358" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">典型消费者</text>
    <text x="52" y="378" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• OpenClaw（兼容 20+ 异构/本地模型）</text>
    <text x="52" y="396" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• Codex（本地 Ollama / LM Studio 兼容）</text>
  </g>

  <!-- Col 2: OpenAI Responses -->
  <g filter="url(#lp-shadow)">
    <rect x="342" y="56" width="296" height="380" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8"/>
    <rect x="342" y="56" width="296" height="34" rx="12" fill="#2563eb"/>
    <rect x="342" y="78" width="296" height="12" fill="#2563eb"/>
    <text x="490" y="78" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">OpenAI Responses API</text>

    <text x="358" y="114" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">定位：面向长程 Agent 的新一代协议</text>
    <text x="358" y="133" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">原生支持状态续接、服务端压缩与语义事件</text>

    <rect x="358" y="148" width="264" height="82" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="370" y="168" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">数据结构：类型化 Item 列表</text>
    <text x="370" y="188" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• message / reasoning / function_call</text>
    <text x="370" y="206" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 独立 compaction 加密压缩态 Item</text>
    <text x="370" y="222" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 语义事件流 + end_turn: false 续跑信号</text>

    <rect x="358" y="242" width="264" height="84" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="370" y="262" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">Agent 原生能力</text>
    <text x="370" y="282" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 原生 /responses/compact 服务端压缩</text>
    <text x="370" y="300" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 加密思考块跨轮无损回传</text>
    <text x="370" y="316" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• previous_response_id 服务端状态链</text>

    <rect x="358" y="338" width="264" height="80" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="370" y="358" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">典型消费者</text>
    <text x="370" y="378" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• Codex（主力引擎 + 远端压缩 V2）</text>
    <text x="370" y="396" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• OpenClaw（OpenAI 直连与 V2 压缩）</text>
  </g>

  <!-- Col 3: Anthropic Messages -->
  <g filter="url(#lp-shadow)">
    <rect x="660" y="56" width="296" height="380" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
    <rect x="660" y="56" width="296" height="34" rx="12" fill="#b45309"/>
    <rect x="660" y="78" width="296" height="12" fill="#b45309"/>
    <text x="808" y="78" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">Anthropic Messages API</text>

    <text x="676" y="114" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">定位：强结构块模型与精细缓存控制</text>
    <text x="676" y="133" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">Claude 全系原生协议，深度优化多轮工具循环</text>

    <rect x="676" y="148" width="264" height="82" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="688" y="168" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">数据结构：统一 Content Block 数组</text>
    <text x="688" y="188" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• text / thinking(+signature) / tool_use</text>
    <text x="688" y="206" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 严格要求 tool_use ↔ tool_result 紧邻配对</text>
    <text x="688" y="222" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 清晰 stop_reason（end_turn / pause_turn）</text>

    <rect x="676" y="242" width="264" height="84" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="688" y="262" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">Agent 原生能力</text>
    <text x="688" y="282" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 显式 cache_control 断点（5m / 1h）</text>
    <text x="688" y="300" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 服务端 clear_tool_uses 清理旧工具结果</text>
    <text x="688" y="316" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 交错思考（Interleaved Thinking）</text>

    <rect x="676" y="338" width="264" height="80" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="688" y="358" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">典型消费者</text>
    <text x="688" y="378" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• Claude Code（原生深度绑定）</text>
    <text x="688" y="396" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• OpenClaw（Session Pruning 服务端清理）</text>
  </g>
</svg>
