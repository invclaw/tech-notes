<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" role="img" aria-label="RLVR GRPO/DAPO 闭环与训推偏差稳定化机制全景">
  <defs>
    <linearGradient id="rl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="rl-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="rl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="980" height="490" rx="14" fill="url(#rl-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">RLVR / GRPO / DAPO 核心闭环与生产级训推偏差稳定化架构</text>

  <!-- Top Flow: GRPO / DAPO Group Loop -->
  <g filter="url(#rl-shadow)">
    <rect x="24" y="54" width="932" height="176" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="24" y="54" width="932" height="30" rx="12" fill="#2563eb"/>
    <rect x="24" y="72" width="932" height="12" fill="#2563eb"/>
    <text x="490" y="74" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">无 Critic 的组内相对优化闭环（省去 50% Value 网络显存，直接由环境真值驱动）</text>

    <rect x="40" y="98" width="168" height="116" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="124" y="118" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">1. 组采样 Group Rollout</text>
    <text x="50" y="138" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">同一 Prompt 并行采 G 条</text>
    <text x="50" y="155" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">多轮轨迹 {o₁, o₂, …, o_G}</text>
    <text x="50" y="174" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">记录 rollout_log_probs</text>
    <text x="50" y="191" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">与 MoE routed_experts</text>

    <line x1="210" y1="156" x2="232" y2="156" stroke="#2563eb" stroke-width="1.8" marker-end="url(#rl-arrow)"/>

    <rect x="238" y="98" width="196" height="116" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="336" y="118" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">2. 可验证奖励 Verifier</text>
    <text x="248" y="138" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">• 沙箱跑单测（SandboxFusion）</text>
    <text x="248" y="155" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">• 数学/规则校验或异步 GenRM</text>
    <text x="248" y="174" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• DAPO 软超长惩罚防废话刷分</text>
    <text x="248" y="191" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• 严格超时强杀防死循环饿死</text>

    <line x1="436" y1="156" x2="458" y2="156" stroke="#2563eb" stroke-width="1.8" marker-end="url(#rl-arrow)"/>

    <rect x="464" y="98" width="218" height="116" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="573" y="118" text-anchor="middle" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">3. 动态过滤 &amp; 相对优势</text>
    <text x="474" y="138" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">• DAPO 过滤 std(r)==0 零梯度组</text>
    <text x="474" y="155" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">  （全对或全错立刻丢弃补采）</text>
    <text x="474" y="174" fill="#b45309" font-family="Menlo,monospace" font-size="10">A_i = (r_i - mean(r)) / std(r)</text>
    <text x="474" y="193" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• response_mask 仅对模型字算损失</text>

    <line x1="684" y1="156" x2="706" y2="156" stroke="#2563eb" stroke-width="1.8" marker-end="url(#rl-arrow)"/>

    <rect x="712" y="98" width="228" height="116" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="826" y="118" text-anchor="middle" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">4. 策略更新 Policy Loss</text>
    <text x="722" y="138" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">• Clip-Higher 非对称放宽上界防熵塌</text>
    <text x="722" y="155" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">• GSPO 序列级几何平均重要采样</text>
    <text x="722" y="174" fill="#6d28d9" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• CISPO 单边 stop-grad 稳定大步长</text>
    <text x="722" y="191" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• k3+ 直通 KL 兼顾低方差与无偏梯度</text>
  </g>

  <!-- Bottom: Train-Inference Mismatch & Stabilization (2 columns) -->
  <g filter="url(#rl-shadow)">
    <rect x="24" y="248" width="456" height="222" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="24" y="248" width="456" height="30" rx="12" fill="#dc2626"/>
    <rect x="24" y="266" width="456" height="12" fill="#dc2626"/>
    <text x="252" y="268" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">生产 RL 最致命暗礁：为什么模型训着训着会“崩盘”？</text>

    <rect x="40" y="292" width="424" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="52" y="311" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">1. 训推数值不一致（Train-Inference Mismatch）</text>
    <text x="52" y="330" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.3">推理走 SGLang/vLLM（FP8 / FlashInfer），训练走 Megatron/FSDP（BF16），log_prob 漂移</text>

    <rect x="40" y="352" width="424" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="52" y="371" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">2. MoE 专家路由抖动（Routing Drift）</text>
    <text x="52" y="390" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.3">细微浮点误差让训练前向选了与推理不同的 Top-k 专家，直接撕裂策略梯度</text>

    <rect x="40" y="412" width="424" height="46" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="52" y="431" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">3. 异步 Off-Policy 陈旧度（Staleness）</text>
    <text x="52" y="448" fill="#78350f" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.3">长尾 Agent 轨迹跨越多次权重更新后，旧策略采样样本与新权重分布偏离过大</text>
  </g>

  <g filter="url(#rl-shadow)">
    <rect x="500" y="248" width="456" height="222" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="500" y="248" width="456" height="30" rx="12" fill="#0f766e"/>
    <rect x="500" y="266" width="456" height="12" fill="#0f766e"/>
    <text x="728" y="268" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">2026 工业级稳定化四件套（verl &amp; slime 源码实证）</text>

    <rect x="516" y="292" width="424" height="48" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="528" y="311" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">① TIS / IcePop / Rollout IS-RS 校正</text>
    <text x="528" y="329" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">截断重要采样比与散度拒绝采样（verl rollout_corr_helper / slime TIS &amp; MIS）</text>

    <rect x="516" y="346" width="424" height="48" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="528" y="365" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">② R3 MoE 路由回放（Routing Replay）</text>
    <text x="528" y="383" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">Rollout 采集 routed_experts，训练强行按原专家路由重放（对齐 SGLang 累加序）</text>

    <rect x="516" y="400" width="424" height="58" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="528" y="419" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">③ OPSM 负优势熔断 &amp; 精确 Top-p 重放</text>
    <text x="528" y="436" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">slime compute_opsm_mask 屏蔽（A&lt;0 且 KL 超阈）坏样本防雪崩；</text>
    <text x="528" y="451" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">calculate_ragged_log_probs 在训练侧精确还原推理 Top-p 截断支持集</text>
  </g>
</svg>
