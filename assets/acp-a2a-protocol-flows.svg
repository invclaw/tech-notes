<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-label="ACP 会话流式交互模型与 A2A v1.0 不可变 Task 状态机对照">
  <defs>
    <linearGradient id="aa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="aa-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="aa-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="980" height="480" rx="14" fill="url(#aa-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">ACP 双向富交互会话模型 vs A2A v1.0 不可变异步 Task 状态机</text>

  <!-- Left: ACP -->
  <g filter="url(#aa-shadow)">
    <rect x="24" y="54" width="456" height="404" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="24" y="54" width="456" height="32" rx="12" fill="#2563eb"/>
    <rect x="24" y="74" width="456" height="12" fill="#2563eb"/>
    <text x="252" y="75" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">ACP（Agent Client Protocol · v1.35 / v2-beta）</text>

    <rect x="40" y="98" width="424" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="52" y="117" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">1. 会话初始化与 MCP 注入（Client → Agent）</text>
    <text x="52" y="136" fill="#334155" font-family="Menlo,monospace" font-size="9.8">initialize → session/new(cwd, mcpServers[])</text>
    <text x="52" y="154" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">编辑器以子进程启动 Agent（stdio NDJSON），注入工作区与工具集</text>

    <rect x="40" y="180" width="424" height="92" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="52" y="199" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">2. 19 种富语义 session/update 流式推送（UX-First）</text>
    <text x="52" y="218" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• 思考与正文：agent_thought_chunk / agent_message_chunk</text>
    <text x="52" y="235" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• 编码视图：tool_call_update 内嵌 diff {path,oldText,newText} + locations</text>
    <text x="52" y="252" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• 治理与协作：plan_update / compaction_update / subagent_update</text>

    <rect x="40" y="282" width="424" height="78" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="52" y="301" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">3. 反向 HITL 审批与 v1 → v2 职责瘦身</text>
    <text x="52" y="320" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• session/request_permission：基线必填（allow_once / allow_always 等）</text>
    <text x="52" y="337" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• v1 含反向 fs/* 与 terminal/* 读未保存缓冲区；</text>
    <text x="52" y="352" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">  v2 预览版将其剥离并建议改由 Client 提供 MCP Server</text>

    <rect x="40" y="370" width="424" height="74" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="52" y="389" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">4. 回合终止与会话恢复</text>
    <text x="52" y="407" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• v1：session/prompt 挂起直至返回 StopReason（end_turn / cancelled）</text>
    <text x="52" y="424" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• v2：session/prompt 立即确认，终态改由 state_update 通知汇报</text>
  </g>

  <!-- Right: A2A v1.0 -->
  <g filter="url(#aa-shadow)">
    <rect x="500" y="54" width="456" height="404" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
    <rect x="500" y="54" width="456" height="32" rx="12" fill="#b45309"/>
    <rect x="500" y="74" width="456" height="12" fill="#b45309"/>
    <text x="728" y="75" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">A2A（Agent2Agent Protocol · v1.0.1 / a2a.proto）</text>

    <rect x="516" y="98" width="424" height="66" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="528" y="117" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">1. 预连接名片发现（RFC 8615 + JWS 防篡改）</text>
    <text x="528" y="135" fill="#334155" font-family="Menlo,monospace" font-size="9.8">GET /.well-known/agent-card.json</text>
    <text x="528" y="152" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">声明 supportedInterfaces[]（JSONRPC / gRPC / REST）、skills 与鉴权</text>

    <!-- Task State Machine Box -->
    <rect x="516" y="174" width="424" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="528" y="193" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">2. 终态不可变 Task 状态机（TASK_STATE_*）</text>

    <!-- Nodes -->
    <rect x="530" y="206" width="94" height="28" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="577" y="224" text-anchor="middle" fill="#1e3a8a" font-family="Menlo,monospace" font-size="9.5" font-weight="700">SUBMITTED</text>
    <line x1="626" y1="220" x2="652" y2="220" stroke="#b45309" stroke-width="1.6" marker-end="url(#aa-arrow)"/>

    <rect x="658" y="206" width="90" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="703" y="224" text-anchor="middle" fill="#1e3a8a" font-family="Menlo,monospace" font-size="9.5" font-weight="700">WORKING</text>

    <!-- Interrupt states -->
    <line x1="703" y1="236" x2="703" y2="258" stroke="#b45309" stroke-width="1.5" marker-start="url(#aa-arrow)" marker-end="url(#aa-arrow)"/>
    <rect x="530" y="262" width="166" height="28" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="613" y="280" text-anchor="middle" fill="#92400e" font-family="Menlo,monospace" font-size="9.2" font-weight="700">INPUT_REQUIRED</text>
    <rect x="706" y="262" width="150" height="28" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="781" y="280" text-anchor="middle" fill="#92400e" font-family="Menlo,monospace" font-size="9.2" font-weight="700">AUTH_REQUIRED</text>

    <!-- Terminal states -->
    <line x1="750" y1="220" x2="782" y2="220" stroke="#b45309" stroke-width="1.6" marker-end="url(#aa-arrow)"/>
    <rect x="788" y="202" width="138" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="857" y="219" text-anchor="middle" fill="#14532d" font-family="Menlo,monospace" font-size="9.2" font-weight="700">COMPLETED</text>
    <text x="857" y="236" text-anchor="middle" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="9">产出 Artifacts[]</text>

    <rect x="530" y="302" width="396" height="32" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="728" y="322" text-anchor="middle" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">其余不可变终态：FAILED / CANCELED / REJECTED（续作须同 contextId 建新 Task）</text>

    <rect x="516" y="354" width="424" height="90" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="528" y="373" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">3. v1.0 核心重构（对照旧版 v0.3）</text>
    <text x="528" y="391" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• 规范源统一为 specification/a2a.proto（ProtoJSON 序列化）</text>
    <text x="528" y="408" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• JSON-RPC 方法改为 PascalCase：SendMessage / GetTask / SubscribeToTask</text>
    <text x="528" y="425" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">• Part 合并为 oneof { text | raw | url | data }，支持异步 Webhook 推送</text>
  </g>
</svg>
