<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="Computer Use 四层感知、混合动作与虚拟桌面架构图">
  <defs>
    <linearGradient id="cu-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="cu-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="cu-arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <filter id="cu-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="980" height="470" rx="14" fill="url(#cu-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">Computer Use 全栈架构：绝不只靠截图（四层感知 + 混合执行 + 虚拟桌面）</text>

  <!-- Column 1: 4 Perception Channels -->
  <rect x="24" y="54" width="302" height="392" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="24" y="54" width="302" height="30" rx="12" fill="#7c3aed"/>
  <rect x="24" y="72" width="302" height="12" fill="#7c3aed"/>
  <text x="175" y="74" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">一、四层感知通道（不只靠截图）</text>

  <g filter="url(#cu-shadow)">
    <rect x="38" y="98" width="274" height="72" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.4"/>
    <text x="50" y="119" fill="#4c1d95" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">1. 屏幕视觉像素（兜底全覆盖）</text>
    <text x="50" y="139" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 归一化缩放（如 1280×800）+ 局部放大</text>
    <text x="50" y="156" fill="#6d28d9" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 帧差分跳过静止画面，省 Token</text>
  </g>

  <g filter="url(#cu-shadow)">
    <rect x="38" y="182" width="274" height="74" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4"/>
    <text x="50" y="203" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">2. OS 无障碍控件树（桌面的 DOM）</text>
    <text x="50" y="223" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• macOS AXUIElement · Win UIA · Linux AT-SPI2</text>
    <text x="50" y="241" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 直接拿按钮名称与精确框，告别猜像素</text>
  </g>

  <g filter="url(#cu-shadow)">
    <rect x="38" y="268" width="274" height="72" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
    <text x="50" y="289" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">3. 窗口元数据 + 系统剪贴板</text>
    <text x="50" y="309" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 直查窗口列表、激活焦点与几何位置</text>
    <text x="50" y="326" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 大段文本/中文走剪贴板粘贴，快百倍</text>
  </g>

  <g filter="url(#cu-shadow)">
    <rect x="38" y="352" width="274" height="78" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/>
    <text x="50" y="373" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">4. Shell / 文件工具混合协同</text>
    <text x="50" y="393" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 同配 bash + editor + computer 三件套</text>
    <text x="50" y="411" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 能命令行解决绝不点鼠标，GUI 只做最后一公里</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="326" y1="250" x2="358" y2="250" stroke="#7c3aed" stroke-width="2" marker-end="url(#cu-arr-purple)"/>

  <!-- Column 2: Grounding & Action Set -->
  <rect x="364" y="54" width="274" height="392" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="364" y="54" width="274" height="30" rx="12" fill="#2563eb"/>
  <rect x="364" y="72" width="274" height="12" fill="#2563eb"/>
  <text x="501" y="74" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">二、定位决策与动作原语</text>

  <g filter="url(#cu-shadow)">
    <rect x="378" y="98" width="246" height="106" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="390" y="119" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">定位路线（Grounding）</text>
    <text x="390" y="140" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 端到端模型直出坐标（Claude / CUA）</text>
    <text x="390" y="160" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 控件树 / OmniParser + SoM 选编号</text>
    <text x="390" y="182" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">⚠ 必须处理 HiDPI/Retina 2x 坐标换算</text>
  </g>

  <g filter="url(#cu-shadow)">
    <rect x="378" y="218" width="246" height="126" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="390" y="239" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">标准键鼠动作原语</text>
    <text x="390" y="260" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 单击 / 双击 / 三击选行 / 右键</text>
    <text x="390" y="279" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 悬停 hover · 拖拽 drag · 滚轮 scroll</text>
    <text x="390" y="298" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 快捷键组合（Ctrl/Cmd+C/V/S）</text>
    <text x="390" y="317" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 等待 UI 稳定（300–500ms）再校验</text>
  </g>

  <g filter="url(#cu-shadow)">
    <rect x="378" y="358" width="246" height="72" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="390" y="379" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">成本与防死循环控制</text>
    <text x="390" y="399" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">• 旧截图及时裁剪/清缓存，防撑爆窗口</text>
    <text x="390" y="416" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">• 画面连续无变化自动中断重试</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="638" y1="250" x2="670" y2="250" stroke="#2563eb" stroke-width="2" marker-end="url(#cu-arr-blue)"/>

  <!-- Column 3: Virtual Desktop & OS Injection -->
  <rect x="676" y="54" width="280" height="392" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="676" y="54" width="280" height="30" rx="12" fill="#0f766e"/>
  <rect x="676" y="72" width="280" height="12" fill="#0f766e"/>
  <text x="816" y="74" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">三、执行底座与人机接管</text>

  <g filter="url(#cu-shadow)">
    <rect x="690" y="98" width="252" height="132" rx="8" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.4"/>
    <text x="702" y="119" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">Linux 虚拟桌面栈（云/容器主力）</text>
    <text x="702" y="141" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 虚拟显示：Xvfb (X11) / 无头 Wayland</text>
    <text x="702" y="160" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 窗口管理：XFCE / Fluxbox / Openbox</text>
    <text x="702" y="179" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 输入注入：xdotool / ydotool / uinput</text>
    <text x="702" y="198" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">✓ 不抢占人类物理鼠标，天然容器隔离</text>
  </g>

  <g filter="url(#cu-shadow)">
    <rect x="690" y="244" width="252" height="84" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="702" y="265" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">macOS / Windows 本机注入</text>
    <text x="702" y="286" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• macOS：CGEvent（需辅助+录屏权限）</text>
    <text x="702" y="306" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• Windows：SendInput API</text>
  </g>

  <g filter="url(#cu-shadow)">
    <rect x="690" y="342" width="252" height="88" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="702" y="363" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">实时推流与人工接管（HITL）</text>
    <text x="702" y="384" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• x11vnc + noVNC / 低延迟 WebRTC</text>
    <text x="702" y="404" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">• 遇 2FA / 验证码 / 支付，人一键接管</text>
  </g>
</svg>
