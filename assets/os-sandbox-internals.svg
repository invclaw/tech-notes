<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-label="三大操作系统进程级沙箱内核拦截原理对比图">
  <defs>
    <linearGradient id="os-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="os-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <filter id="os-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="980" height="480" rx="14" fill="url(#os-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">三大操作系统进程级沙箱：内核拦截链路对比</text>

  <!-- Column 1: macOS -->
  <g filter="url(#os-shadow)">
    <rect x="24" y="54" width="296" height="402" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
    <rect x="24" y="54" width="296" height="32" rx="12" fill="#1e293b"/>
    <rect x="24" y="74" width="296" height="12" fill="#1e293b"/>
    <text x="172" y="75" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">macOS · Seatbelt (XNU MAC)</text>

    <rect x="42" y="102" width="260" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="172" y="123" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">1. SBPL 策略 → 字节码编译</text>
    <text x="172" y="143" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">声明式规则编译后经 syscall 注入内核</text>
    <text x="172" y="157" text-anchor="middle" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">永久绑定到进程凭证 ucred</text>

    <line x1="172" y1="164" x2="172" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#os-arr)"/>

    <rect x="42" y="196" width="260" height="120" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="172" y="218" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">2. XNU TrustedBSD MAC 钩子</text>
    <text x="56" y="241" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 文件 VFS 钩子：拦截 open/unlink/write</text>
    <text x="56" y="261" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• Socket 钩子：禁外连 / 仅放本地代理</text>
    <text x="56" y="281" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• Mach IPC 钩子：限制系统服务查找</text>
    <text x="56" y="301" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">→ Sandbox.kext 状态机极速裁决 EPERM</text>

    <line x1="172" y1="316" x2="172" y2="342" stroke="#475569" stroke-width="1.8" marker-end="url(#os-arr)"/>

    <rect x="42" y="348" width="260" height="90" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="172" y="369" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">3. 遗传与收口特性</text>
    <text x="56" y="391" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• fork/exec 孙进程自动继承，不可撤销</text>
    <text x="56" y="410" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 系统原生自带，零依赖、毫秒级启动</text>
    <text x="56" y="428" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">（单层机制覆盖文件 + 网络 + IPC）</text>
  </g>

  <!-- Column 2: Linux -->
  <g filter="url(#os-shadow)">
    <rect x="342" y="54" width="296" height="402" rx="12" fill="#ffffff" stroke="#5eead4" stroke-width="1.6"/>
    <rect x="342" y="54" width="296" height="32" rx="12" fill="#0f766e"/>
    <rect x="342" y="74" width="296" height="12" fill="#0f766e"/>
    <text x="490" y="75" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">Linux · 三件套正交组合</text>

    <rect x="360" y="102" width="260" height="96" rx="8" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.4"/>
    <text x="490" y="123" text-anchor="middle" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">1. Bubblewrap（视野隔离）</text>
    <text x="374" y="144" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 非特权 UserNS 获得 Mount 权限</text>
    <text x="374" y="163" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 只读挂系统目录 + 遮蔽敏感目录</text>
    <text x="374" y="182" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• pivot_root 切根 + 断开 Net/PID NS</text>

    <line x1="490" y1="198" x2="490" y2="218" stroke="#475569" stroke-width="1.8" marker-end="url(#os-arr)"/>

    <rect x="360" y="224" width="260" height="94" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="490" y="245" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">2. Landlock LSM（路径白名单）</text>
    <text x="374" y="266" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 需先设 NO_NEW_PRIVS 禁 SUID 提权</text>
    <text x="374" y="285" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 按目录 fd/inode 焊死读写权限</text>
    <text x="374" y="304" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 只可层层叠加收紧，永不可撤销</text>

    <line x1="490" y1="318" x2="490" y2="338" stroke="#475569" stroke-width="1.8" marker-end="url(#os-arr)"/>

    <rect x="360" y="344" width="260" height="94" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
    <text x="490" y="365" text-anchor="middle" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">3. Seccomp-BPF（调用面过滤）</text>
    <text x="374" y="386" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• cBPF 挂在内核 syscall 入口</text>
    <text x="374" y="405" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 封杀 ptrace / mount / io_uring 等</text>
    <text x="374" y="424" fill="#b91c1c" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">（不解引用路径指针，专注 syscall 号过滤）</text>
  </g>

  <!-- Column 3: Windows -->
  <g filter="url(#os-shadow)">
    <rect x="660" y="54" width="296" height="402" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.6"/>
    <rect x="660" y="54" width="296" height="32" rx="12" fill="#4f46e5"/>
    <rect x="660" y="74" width="296" height="12" fill="#4f46e5"/>
    <text x="808" y="75" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">Windows · 令牌 + ACL + Job</text>

    <rect x="678" y="102" width="260" height="96" rx="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="808" y="123" text-anchor="middle" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">1. Restricted Token（受限令牌）</text>
    <text x="692" y="144" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 剥离高危特权 + 管理员 SID 改 Deny-Only</text>
    <text x="692" y="163" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 叠加 Restricting SIDs 双重 ACL 校验</text>
    <text x="692" y="182" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 降低完整性级别（Low Integrity）</text>

    <line x1="808" y1="198" x2="808" y2="218" stroke="#475569" stroke-width="1.8" marker-end="url(#os-arr)"/>

    <rect x="678" y="224" width="260" height="94" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="808" y="245" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">2. AppContainer（默认全拒绝）</text>
    <text x="692" y="266" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 分配唯一 Package SID，默认无权读宿主</text>
    <text x="692" y="285" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 仅显式授权工作区 ACL + 网络 Capability</text>
    <text x="692" y="304" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 独立对象命名空间 + UIPI 防窗口注入</text>

    <line x1="808" y1="318" x2="808" y2="338" stroke="#475569" stroke-width="1.8" marker-end="url(#os-arr)"/>

    <rect x="678" y="344" width="260" height="94" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="808" y="365" text-anchor="middle" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">3. Job Object（资源与进程树收口）</text>
    <text x="692" y="386" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 限制进程数、CPU 与内存上限</text>
    <text x="692" y="405" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• KILL_ON_JOB_CLOSE 关闭即杀全树</text>
    <text x="692" y="424" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">（等价于 Linux cgroups + 进程组清理）</text>
  </g>
</svg>
