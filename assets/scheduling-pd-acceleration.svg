<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 515" width="980" height="515" role="img" aria-label="连续批处理、CPU/GPU 异步重叠、PD 分离与三大推理加速支柱全景图">
  <defs>
    <linearGradient id="sa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="sa-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="sa-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="980" height="515" rx="14" fill="url(#sa-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">现代推理引擎调度与加速全景：重叠流水、PD 分离与三大硬件加速支柱</text>

  <!-- Top Left: Overlap Scheduling + Continuous Batching -->
  <g filter="url(#sa-shadow)">
    <rect x="24" y="52" width="460" height="206" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
    <rect x="24" y="52" width="460" height="30" rx="12" fill="#334155"/>
    <rect x="24" y="70" width="460" height="12" fill="#334155"/>
    <text x="254" y="72" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">连续批处理 + Chunked Prefill + 1-Step CPU/GPU 异步重叠</text>

    <!-- Timeline Lanes -->
    <text x="38" y="108" fill="#1e293b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">CPU 调度线程</text>
    <rect x="122" y="94" width="108" height="24" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="176" y="110" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="10" font-weight="700">调度 Batch t</text>
    <rect x="236" y="94" width="114" height="24" rx="5" fill="#fef3c7" stroke="#d97706"/>
    <text x="293" y="110" text-anchor="middle" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10" font-weight="700">收尾 t-1 / Grammar</text>
    <rect x="356" y="94" width="114" height="24" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="413" y="110" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="10" font-weight="700">调度 Batch t+1</text>

    <text x="38" y="146" fill="#1e293b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">GPU 计算流</text>
    <rect x="122" y="132" width="108" height="24" rx="5" fill="#dcfce7" stroke="#16a34a"/>
    <text x="176" y="148" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10" font-weight="700">前向 Batch t-1</text>
    <rect x="236" y="132" width="152" height="24" rx="5" fill="#bbf7d0" stroke="#15803d"/>
    <text x="312" y="148" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10" font-weight="700">前向 Batch t（Future 占位）</text>
    <rect x="394" y="132" width="76" height="24" rx="5" fill="#e0e7ff" stroke="#4f46e5"/>
    <text x="432" y="148" text-anchor="middle" fill="#3730a3" font-family="-apple-system,PingFang SC,sans-serif" font-size="10" font-weight="700">Sample t</text>

    <rect x="38" y="168" width="432" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="50" y="187" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">三家调度范式差异：</text>
    <text x="50" y="205" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• vLLM V1：对称 token_budget + 默认 Chunked Prefill + AsyncScheduler 占位</text>
    <text x="50" y="221" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• SGLang：Prefill 优先 + LPM 排序 + event_loop_overlap + FutureMap 回填</text>
    <text x="50" y="237" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• TRT-LLM：V2 BudgetTracker + beneficialToSkip 防雪崩 + AgentTree 配额</text>
  </g>

  <!-- Top Right: PD Disaggregation -->
  <g filter="url(#sa-shadow)">
    <rect x="500" y="52" width="456" height="206" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="500" y="52" width="456" height="30" rx="12" fill="#2563eb"/>
    <rect x="500" y="70" width="456" height="12" fill="#2563eb"/>
    <text x="728" y="72" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">PD 分离架构（Prefill-Decode Disaggregation）</text>

    <!-- Router -->
    <rect x="516" y="96" width="84" height="72" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="558" y="124" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">智能路由</text>
    <text x="558" y="142" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.5">缓存感知</text>
    <text x="558" y="156" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.5">长度分桶</text>

    <line x1="600" y1="132" x2="624" y2="132" stroke="#2563eb" stroke-width="1.8" marker-end="url(#sa-arrow)"/>

    <!-- Prefill Pool -->
    <rect x="630" y="96" width="124" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="692" y="117" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">Prefill 实例池</text>
    <text x="692" y="135" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">高算力 · 专攻 TTFT</text>
    <text x="692" y="150" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">算出未命中前缀 KV</text>
    <text x="692" y="163" text-anchor="middle" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.4">独立 TP/PP 切分</text>

    <!-- RDMA Transfer -->
    <line x1="754" y1="132" x2="808" y2="132" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#sa-arrow)"/>
    <text x="781" y="117" text-anchor="middle" fill="#1d4ed8" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.5" font-weight="700">NIXL/RDMA</text>
    <text x="781" y="128" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="9">Mooncake</text>

    <!-- Decode Pool -->
    <rect x="814" y="96" width="126" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="877" y="117" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">Decode 实例池</text>
    <text x="877" y="135" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">大 Batch · 稳 TPOT</text>
    <text x="877" y="150" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">本地命中前缀免传</text>
    <text x="877" y="163" text-anchor="middle" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.4">专注流式逐字生成</text>

    <rect x="516" y="178" width="424" height="68" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="528" y="196" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">为何对 Agent 价值巨大？</text>
    <text x="528" y="214" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 彻底消除“某会话注入 50K 代码文件 → 拖垮全机其他用户吐字”的相互干扰</text>
    <text x="528" y="232" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 支持异构并行（TRT-LLM CacheFormatter）与三分离 EPD（多模态编码独立）</text>
  </g>

  <!-- Bottom Row: 3 Acceleration Pillars -->
  <!-- Pillar 1: Speculative Decoding -->
  <g filter="url(#sa-shadow)">
    <rect x="24" y="276" width="298" height="218" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="24" y="276" width="298" height="30" rx="12" fill="#0f766e"/>
    <rect x="24" y="294" width="298" height="12" fill="#0f766e"/>
    <text x="173" y="296" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">加速支柱 1 · 投机解码（Speculative）</text>

    <text x="38" y="328" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">本质：用富裕算力换取 HBM 带宽</text>
    <text x="38" y="346" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">草稿器一次猜 k 个 Token → 目标模型单次前向并行校验</text>

    <rect x="38" y="358" width="270" height="72" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="50" y="376" fill="#134e4a" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.6" font-weight="700">2026 主流路线（Medusa 已退潮）</text>
    <text x="50" y="393" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.3">• EAGLE3 / MTP（共享隐藏态与 Head）</text>
    <text x="50" y="409" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.3">• N-gram / Suffix Automaton（零显存）</text>
    <text x="50" y="424" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.3">• DFlash / PARD / DSpark 并行草稿器</text>

    <text x="38" y="449" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4" font-weight="700">Agent 收益：代码编辑与工具 JSON 重复度极高</text>
    <text x="38" y="466" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">支持在线接受率自适应步长 + 语法验证回滚</text>
    <text x="38" y="481" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">低接受率自动熔断（SpeculationGate）</text>
  </g>

  <!-- Pillar 2: Constrained Decoding -->
  <g filter="url(#sa-shadow)">
    <rect x="341" y="276" width="298" height="218" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="341" y="276" width="298" height="30" rx="12" fill="#6d28d9"/>
    <rect x="341" y="294" width="298" height="12" fill="#6d28d9"/>
    <text x="490" y="296" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">加速支柱 2 · 受约束解码（Grammar）</text>

    <text x="355" y="328" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">本质：采样前将非法 Token Logit 置 -∞</text>
    <text x="355" y="346" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">三家统一收敛至 XGrammar / llguidance 亚毫秒掩码</text>

    <rect x="355" y="358" width="270" height="72" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="367" y="376" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.6" font-weight="700">Agent 必配三大工程突破</text>
    <text x="367" y="393" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.3">• StructuralTag：正文自由 + 工具调用强约束</text>
    <text x="367" y="409" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.3">• Reasoning 门控：跳过 &lt;think&gt; 防伤推理链</text>
    <text x="367" y="424" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.3">• CapturableGuidedDecoder：嵌入 CUDA Graph</text>

    <text x="355" y="449" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4" font-weight="700">2026 源码勘误：SGLang 已无通用 Jump-Forward</text>
    <text x="355" y="466" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">三家均转向：异步语法编译 + 并行填码 + 投机协同</text>
    <text x="355" y="481" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">解决工具参数 JSON 损坏与“嘴上调工具”退化</text>
  </g>

  <!-- Pillar 3: Quantization & Wide-EP MoE -->
  <g filter="url(#sa-shadow)">
    <rect x="658" y="276" width="298" height="218" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
    <rect x="658" y="276" width="298" height="30" rx="12" fill="#b45309"/>
    <rect x="658" y="294" width="298" height="12" fill="#b45309"/>
    <text x="807" y="296" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">加速支柱 3 · 低精度与 Wide-EP MoE</text>

    <text x="672" y="328" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">本质：压减权重量与专家通信空泡</text>
    <text x="672" y="346" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">面向 DeepSeek-V3/V4、Qwen3-MoE 等超大模型</text>

    <rect x="672" y="358" width="270" height="72" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="684" y="376" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.6" font-weight="700">前沿算子与集群拓扑栈</text>
    <text x="684" y="393" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.3">• Blockwise FP8 / MXFP8 / NVFP4 + FP4 KV</text>
    <text x="684" y="409" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.3">• DP-Attention（防 MLA KV 重复存）+ Wide-EP</text>
    <text x="684" y="424" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.3">• DeepEP / MNNVL 单边通信 + 动态 EPLB</text>

    <text x="672" y="449" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4" font-weight="700">微批重叠：TBO / DBO 隐藏 All-to-All 延迟</text>
    <text x="672" y="466" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">Micro-batch A 通信与 B 的 GEMM/Attn 交叉执行</text>
    <text x="672" y="481" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">TRT-LLM 额外提供 SM100/107 trtllm-gen 专用核</text>
  </g>
</svg>
