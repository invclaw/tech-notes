<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="OpenClaw 分层全景架构图">
  <defs>
    <linearGradient id="oc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="oc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <filter id="oc-shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="14" fill="url(#oc-bg)" stroke="#dbeafe" stroke-width="1.5"/>
  <text x="480" y="32" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16" font-weight="700">OpenClaw 整体分层架构全景（Trusted Gateway · Untrusted Execution）</text>

  <!-- Left: Channels & Clients -->
  <g filter="url(#oc-shadow)">
    <rect x="24" y="56" width="210" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="24" y="56" width="210" height="28" rx="10" fill="#1e293b"/>
    <rect x="24" y="74" width="210" height="10" fill="#1e293b"/>
    <text x="129" y="75" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">消息渠道 Channels (20+)</text>
    <text x="38" y="106" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• WhatsApp / Telegram</text>
    <text x="38" y="128" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• Slack / Discord / Teams</text>
    <text x="38" y="150" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• iMessage / Signal / Matrix</text>
    <text x="38" y="172" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• WebChat / Webhook / Cron</text>
    <text x="38" y="206" fill="#64748b" font-family="Menlo,monospace" font-size="10.5">extensions/* · Pairing Guard</text>
  </g>

  <g filter="url(#oc-shadow)">
    <rect x="24" y="244" width="210" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="24" y="244" width="210" height="28" rx="10" fill="#334155"/>
    <rect x="24" y="262" width="210" height="10" fill="#334155"/>
    <text x="129" y="263" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">客户端与设备节点</text>
    <text x="38" y="294" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• Control UI / CLI / TUI</text>
    <text x="38" y="316" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• macOS / iOS / Android App</text>
    <text x="38" y="338" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• Node 节点 (role: node)</text>
    <text x="38" y="360" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">  camera / screen / canvas</text>
    <text x="38" y="394" fill="#64748b" font-family="Menlo,monospace" font-size="10.5">WebSocket · Device Token v3</text>
  </g>

  <!-- Arrows into Gateway -->
  <line x1="234" y1="141" x2="278" y2="141" stroke="#475569" stroke-width="1.8" marker-end="url(#oc-arrow)"/>
  <line x1="234" y1="329" x2="278" y2="329" stroke="#475569" stroke-width="1.8" marker-end="url(#oc-arrow)"/>

  <!-- Center: Gateway Control Plane -->
  <g filter="url(#oc-shadow)">
    <rect x="286" y="56" width="388" height="358" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8"/>
    <rect x="286" y="56" width="388" height="34" rx="12" fill="#2563eb"/>
    <rect x="286" y="78" width="388" height="12" fill="#2563eb"/>
    <text x="480" y="78" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="13.5" font-weight="700">Gateway 单控制面 (ws://127.0.0.1:18789)</text>

    <!-- Sub-boxes inside Gateway -->
    <rect x="304" y="106" width="170" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="389" y="128" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">WS RPC &amp; 鉴权配对</text>
    <text x="389" y="148" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">TypeBox 协议 · 幂等去重</text>
    <text x="389" y="166" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">设备配对 · Token/Tailscale</text>

    <rect x="486" y="106" width="170" height="74" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="571" y="128" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">路由与多 Agent 绑定</text>
    <text x="571" y="148" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">Bindings · dmScope 隔离</text>
    <text x="571" y="166" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">Session Controller 串行化</text>

    <rect x="304" y="196" width="352" height="96" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="480" y="218" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">Agent Loop + Context Engine + Plugin Hooks</text>
    <text x="480" y="240" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">Ingest → Assemble → Model Inference → Tool Policy → Stream</text>
    <text x="480" y="260" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">activeWriterRunId 写围栏 · before_tool_call / before_prompt_build</text>
    <text x="480" y="278" text-anchor="middle" fill="#15803d" font-family="Menlo,monospace" font-size="10.5">src/agents · src/context-engine · src/hooks · src/plugins</text>

    <rect x="304" y="308" width="170" height="88" rx="8" fill="#fefce8" stroke="#fde68a"/>
    <text x="389" y="330" text-anchor="middle" fill="#854d0e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">分层记忆 &amp; Dreaming</text>
    <text x="389" y="350" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">MEMORY.md · 每日笔记</text>
    <text x="389" y="368" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">Provenance 防投毒晋升</text>
    <text x="389" y="384" text-anchor="middle" fill="#a16207" font-family="Menlo,monospace" font-size="10">SQLite / Postgres</text>

    <rect x="486" y="308" width="170" height="88" rx="8" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="571" y="330" text-anchor="middle" fill="#831843" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">安全策略 &amp; 调度器</text>
    <text x="571" y="350" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">Tool Policy 5层过滤</text>
    <text x="571" y="368" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">GatewayScheduler / Cron</text>
    <text x="571" y="384" text-anchor="middle" fill="#9d174d" font-family="Menlo,monospace" font-size="10">Elevated · Approvals</text>
  </g>

  <!-- Arrows out of Gateway -->
  <line x1="674" y1="141" x2="718" y2="141" stroke="#475569" stroke-width="1.8" marker-end="url(#oc-arrow)"/>
  <line x1="674" y1="329" x2="718" y2="329" stroke="#475569" stroke-width="1.8" marker-end="url(#oc-arrow)"/>

  <!-- Right: Models & Execution Sandbox -->
  <g filter="url(#oc-shadow)">
    <rect x="726" y="56" width="210" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="726" y="56" width="210" height="28" rx="10" fill="#0f766e"/>
    <rect x="726" y="74" width="210" height="10" fill="#0f766e"/>
    <text x="831" y="75" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">模型与 Agent Harness</text>
    <text x="740" y="106" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• Anthropic / OpenAI / Bedrock</text>
    <text x="740" y="128" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• 本地模型 (Ollama / vLLM)</text>
    <text x="740" y="150" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• Codex App-Server / Claude</text>
    <text x="740" y="172" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• Failover &amp; Auth Profiles</text>
    <text x="740" y="206" fill="#0f766e" font-family="Menlo,monospace" font-size="10.5">Pluggable Providers</text>
  </g>

  <g filter="url(#oc-shadow)">
    <rect x="726" y="244" width="210" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="726" y="244" width="210" height="28" rx="10" fill="#7c3aed"/>
    <rect x="726" y="262" width="210" height="10" fill="#7c3aed"/>
    <text x="831" y="263" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">工具执行与沙盒边界</text>
    <text x="740" y="294" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• Host 本机 / Docker 沙盒</text>
    <text x="740" y="316" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• OpenShell (SSH 远程沙盒)</text>
    <text x="740" y="338" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• MCP Servers / Skills</text>
    <text x="740" y="360" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">• Browser / Canvas / Cron</text>
    <text x="740" y="394" fill="#7c3aed" font-family="Menlo,monospace" font-size="10.5">Untrusted Execution Zone</text>
  </g>
</svg>
