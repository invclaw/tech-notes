<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-label="大模型静态权重诞生全链路：从随机初始化到预训练、SFT、RLVR 沙箱强化学习与联合训练">
  <defs>
    <linearGradient id="pt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="pt-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="pt-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="980" height="480" rx="14" fill="url(#pt-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">权重是怎么炼成的：从随机矩阵到具备 Agent 纪律的 .safetensors 静态文件</text>

  <!-- 4 Stages Row -->
  <!-- Stage 1 -->
  <g filter="url(#pt-shadow)">
    <rect x="20" y="56" width="212" height="214" rx="11" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <rect x="20" y="56" width="212" height="30" rx="11" fill="#475569"/>
    <rect x="20" y="74" width="212" height="12" fill="#475569"/>
    <text x="126" y="76" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">① 预训练 Pre-training</text>
    <text x="32" y="106" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">算力占比：90%+</text>
    <text x="32" y="126" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 随机矩阵起步（白噪音）</text>
    <text x="32" y="144" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 数十万亿 Token 预测下个词</text>
    <text x="32" y="162" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 5D 并行 + AdamW 迭代</text>
    <rect x="32" y="178" width="188" height="78" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="42" y="196" fill="#1e293b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4" font-weight="700">产出：Base 基座权重</text>
    <text x="42" y="214" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">把世界知识与代码模式压进矩阵，</text>
    <text x="42" y="230" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">但只会续写，不懂对话与调工具</text>
    <text x="42" y="246" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">工具报错后不会自主纠偏</text>
  </g>

  <line x1="234" y1="163" x2="254" y2="163" stroke="#475569" stroke-width="1.8" marker-end="url(#pt-arrow)"/>

  <!-- Stage 2 -->
  <g filter="url(#pt-shadow)">
    <rect x="260" y="56" width="212" height="214" rx="11" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="260" y="56" width="212" height="30" rx="11" fill="#2563eb"/>
    <rect x="260" y="74" width="212" height="12" fill="#2563eb"/>
    <text x="366" y="76" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">② 监督微调 SFT</text>
    <text x="272" y="106" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">核心作用：格式冷启动</text>
    <text x="272" y="126" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 喂入高质量多轮示范轨迹</text>
    <text x="272" y="144" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 学会 Chat Template 与工具语法</text>
    <text x="272" y="162" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 学会基础 &lt;think&gt; 推理范式</text>
    <rect x="272" y="178" width="188" height="78" rx="7" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="282" y="196" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4" font-weight="700">局限：死记硬背（Imitation）</text>
    <text x="282" y="214" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">只看标准答案，缺少试错负反馈；</text>
    <text x="282" y="230" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">真实仓库一遇陌生报错就循环</text>
    <text x="282" y="246" fill="#b91c1c" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">容易“嘴上调工具”或瞎编结论</text>
  </g>

  <line x1="474" y1="163" x2="494" y2="163" stroke="#475569" stroke-width="1.8" marker-end="url(#pt-arrow)"/>

  <!-- Stage 3 -->
  <g filter="url(#pt-shadow)">
    <rect x="500" y="56" width="224" height="214" rx="11" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
    <rect x="500" y="56" width="224" height="30" rx="11" fill="#0f766e"/>
    <rect x="500" y="74" width="224" height="12" fill="#0f766e"/>
    <text x="612" y="76" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">③ 沙箱强化学习 RLVR / GRPO</text>
    <text x="512" y="106" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">核心作用：内化 Agent 纪律</text>
    <text x="512" y="126" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 真实容器/MicroVM 多轮探索</text>
    <text x="512" y="144" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 单元测试/环境断言给可验证奖励</text>
    <text x="512" y="162" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 组内相对优势（GRPO/DAPO）</text>
    <rect x="512" y="178" width="200" height="78" rx="7" fill="#f0fdf4" stroke="#86efac"/>
    <text x="522" y="196" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4" font-weight="700">产出：强 Agent 能力内化</text>
    <text x="522" y="214" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">自动习得并行调工具、报错换策略、</text>
    <text x="522" y="230" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">压缩边界自适与早停收敛纪律</text>
    <text x="522" y="246" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">→ 只需极简 300B 系统提示词</text>
  </g>

  <line x1="726" y1="163" x2="746" y2="163" stroke="#475569" stroke-width="1.8" marker-end="url(#pt-arrow)"/>

  <!-- Stage 4 -->
  <g filter="url(#pt-shadow)">
    <rect x="752" y="56" width="208" height="214" rx="11" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
    <rect x="752" y="56" width="208" height="30" rx="11" fill="#b45309"/>
    <rect x="752" y="74" width="208" height="12" fill="#b45309"/>
    <text x="856" y="76" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">④ 剥离、量化与冻结导出</text>
    <text x="764" y="106" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">训练态 → 静态只读文件</text>
    <text x="764" y="126" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 丢弃梯度与 Adam 优化器状态</text>
    <text x="764" y="144" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 切分为 .safetensors 分片</text>
    <text x="764" y="162" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 可选校准量化 FP8 / NVFP4</text>
    <rect x="764" y="178" width="184" height="78" rx="7" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="774" y="196" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4" font-weight="700">交付给推理引擎</text>
    <text x="774" y="214" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">连同 config.json &amp; tokenizer</text>
    <text x="774" y="230" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">加载至 vLLM / SGLang / TRT-LLM</text>
    <text x="774" y="246" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.8">成为只读共享权重池</text>
  </g>

  <!-- Bottom Banner: Harness-Model Co-Design -->
  <g filter="url(#pt-shadow)">
    <rect x="20" y="290" width="940" height="170" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="20" y="290" width="940" height="30" rx="12" fill="#6d28d9"/>
    <rect x="20" y="308" width="940" height="12" fill="#6d28d9"/>
    <text x="490" y="310" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">为什么后训练决定了上层 Agent 的工程天花板？（Harness-Model 联合训练的三大投影）</text>

    <rect x="36" y="334" width="292" height="112" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="48" y="354" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">1. 系统提示词“因模施教”</text>
    <text x="48" y="374" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 强 RL 后训练模型（如 Claude/Codex）</text>
    <text x="48" y="391" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">  行动纪律已进权重，只需 ~300B 提示词</text>
    <text x="48" y="408" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 通用对话模型须靠 8KB+ 提示词外挂补齐</text>
    <text x="48" y="428" fill="#6d28d9" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">对应专题：system-prompts 源码横评</text>

    <rect x="344" y="334" width="292" height="112" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="356" y="354" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">2. 真实工具与压缩格式联合训练</text>
    <text x="356" y="374" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 训练 Rollout 直接运行真实 Harness</text>
    <text x="356" y="391" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">  （如 slime 直接跑 ClaudeCode / Codex CLI）</text>
    <text x="356" y="408" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• apply_patch / WorldState / 压缩钩子全内化</text>
    <text x="356" y="428" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">对应专题：Codex 架构与内置工具对比</text>

    <rect x="652" y="334" width="292" height="112" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="664" y="354" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">3. 端到端 GUI Grounding 权重化</text>
    <text x="664" y="374" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 摆脱脆弱的 DOM 探针与外置检测模型</text>
    <text x="664" y="391" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">• 通过桌面环境 RL 将屏幕像素定位直接</text>
    <text x="664" y="408" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.4">  训入多模态权重（UI-TARS / OS-Atlas）</text>
    <text x="664" y="428" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">对应专题：Browser Use 与 Computer Use</text>
  </g>
</svg>
