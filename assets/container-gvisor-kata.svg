<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" width="980" height="390" role="img" aria-label="Docker 标准容器 vs gVisor 用户态内核 vs Kata 轻量虚拟机隔离对比图">
  <defs>
    <linearGradient id="cgk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cgk-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="980" height="390" rx="14" fill="url(#cgk-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">如何堵住“共享宿主机内核”风险？Docker vs gVisor vs Kata 分层对比</text>

  <!-- Col 1: Docker / Podman -->
  <g filter="url(#cgk-shadow)">
    <rect x="24" y="56" width="296" height="308" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="24" y="56" width="296" height="32" rx="12" fill="#2563eb"/>
    <rect x="24" y="76" width="296" height="12" fill="#2563eb"/>
    <text x="172" y="77" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">1. 标准容器（Docker / Podman）</text>

    <rect x="44" y="106" width="256" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="172" y="128" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">Agent 进程（容器用户态）</text>
    <text x="172" y="148" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">Namespace + cgroups + capDrop</text>

    <text x="172" y="198" text-anchor="middle" fill="#dc2626" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">↓ 全部 300+ Linux Syscall 直达宿主机内核</text>

    <rect x="44" y="214" width="256" height="72" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="172" y="240" text-anchor="middle" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">共享宿主机 Linux 内核</text>
    <text x="172" y="262" text-anchor="middle" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">内核 0-day 漏洞存在逃逸风险</text>

    <text x="172" y="316" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">性能最高 · 兼容性 100%</text>
    <text x="172" y="336" text-anchor="middle" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">适合个人与半信任团队（OpenClaw 默认）</text>
  </g>

  <!-- Col 2: gVisor -->
  <g filter="url(#cgk-shadow)">
    <rect x="342" y="56" width="296" height="308" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="342" y="56" width="296" height="32" rx="12" fill="#7c3aed"/>
    <rect x="342" y="76" width="296" height="12" fill="#7c3aed"/>
    <text x="490" y="77" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">2. gVisor（用户态内核拦截）</text>

    <rect x="362" y="106" width="256" height="50" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
    <text x="490" y="136" text-anchor="middle" fill="#4c1d95" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">Agent 进程（容器用户态）</text>

    <rect x="362" y="170" width="256" height="60" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="490" y="193" text-anchor="middle" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">Sentry 用户态内核（Go 实现）</text>
    <text x="490" y="213" text-anchor="middle" fill="#6d28d9" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">拦截绝大多数系统调用，仅透传极少数</text>

    <rect x="362" y="244" width="256" height="42" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="490" y="270" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">宿主机 Linux 内核（攻击面大减）</text>

    <text x="490" y="316" text-anchor="middle" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">无需硬件虚拟化 · 缩小内核攻击面</text>
    <text x="490" y="336" text-anchor="middle" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">密集 IO/Syscall 性能下降 · 兼容 Docker</text>
  </g>

  <!-- Col 3: Kata Containers -->
  <g filter="url(#cgk-shadow)">
    <rect x="660" y="56" width="296" height="308" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
    <rect x="660" y="56" width="296" height="32" rx="12" fill="#0f766e"/>
    <rect x="660" y="76" width="296" height="12" fill="#0f766e"/>
    <text x="808" y="77" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">3. Kata Containers（容器级轻 VM）</text>

    <rect x="680" y="106" width="256" height="90" rx="8" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="808" y="128" text-anchor="middle" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">Agent 进程 + 独立 Guest 内核</text>
    <text x="808" y="149" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">每个 Pod/容器独占极简 Linux 内核</text>
    <text x="808" y="170" text-anchor="middle" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">（对外仍完全遵守 OCI/K8s 容器接口）</text>

    <rect x="680" y="210" width="256" height="34" rx="7" fill="#dcfce7" stroke="#4ade80"/>
    <text x="808" y="232" text-anchor="middle" fill="#166534" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">KVM 硬件虚拟化硬边界</text>

    <rect x="680" y="254" width="256" height="32" rx="7" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="808" y="275" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">宿主机内核（物理级隔离）</text>

    <text x="808" y="316" text-anchor="middle" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">最强容器隔离 · 100% 真实内核语义</text>
    <text x="808" y="336" text-anchor="middle" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">需宿主机支持 KVM · 内存底噪略高</text>
  </g>
</svg>
