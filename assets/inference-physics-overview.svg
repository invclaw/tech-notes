<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="980" height="510" role="img" aria-label="大模型推理物理模型：Prefill vs Decode、KV Cache 显存账本与长上下文瓶颈全景">
  <defs>
    <linearGradient id="ip-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="ip-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="ip-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="980" height="510" rx="14" fill="url(#ip-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">大模型推理的物理模型：双阶段瓶颈、KV Cache 显存账本与长上下文悬崖</text>

  <!-- Top Left: Prefill -->
  <g filter="url(#ip-shadow)">
    <rect x="24" y="54" width="446" height="196" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="24" y="54" width="446" height="32" rx="12" fill="#2563eb"/>
    <rect x="24" y="74" width="446" height="12" fill="#2563eb"/>
    <text x="247" y="75" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">阶段 1 · Prefill（首字计算阶段 → 决定 TTFT）</text>

    <rect x="40" y="98" width="198" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="52" y="117" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">物理性质：Compute-Bound</text>
    <text x="52" y="135" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">整段 Prompt 并行做 GEMM 矩阵乘</text>
    <text x="52" y="151" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">高算术强度 · 打满 Tensor Core 算力</text>

    <rect x="252" y="98" width="202" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="264" y="117" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">Agent 痛点：长上下文重算</text>
    <text x="264" y="135" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">Attention 计算复杂度随长度 O(n²)</text>
    <text x="264" y="151" fill="#b91c1c" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">工具返回大文件后 TTFT 飙升数秒</text>

    <rect x="40" y="172" width="414" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="52" y="191" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">核心优化杠杆</text>
    <text x="52" y="209" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">• Prefix Caching（跳过已算前缀） • Chunked Prefill（切片防阻塞同机 Decode）</text>
    <text x="52" y="226" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">• FlashAttention / FlashMLA（IO 感知分块） • PD 分离（专用高算力 P 节点）</text>
  </g>

  <!-- Arrow between Prefill and Decode -->
  <line x1="472" y1="152" x2="504" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#ip-arrow)"/>
  <text x="488" y="142" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="9.5" font-weight="700">写KV</text>

  <!-- Top Right: Decode -->
  <g filter="url(#ip-shadow)">
    <rect x="510" y="54" width="446" height="196" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
    <rect x="510" y="54" width="446" height="32" rx="12" fill="#0f766e"/>
    <rect x="510" y="74" width="446" height="12" fill="#0f766e"/>
    <text x="733" y="75" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">阶段 2 · Decode（逐字生成阶段 → 决定 TPOT / 吞吐）</text>

    <rect x="526" y="98" width="198" height="62" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="538" y="117" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">物理性质：Memory-BW-Bound</text>
    <text x="538" y="135" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">每吐 1 Token 全量读权重 + 全部 KV</text>
    <text x="538" y="151" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">极低算术强度 · 卡在 HBM 搬运带宽</text>

    <rect x="738" y="98" width="202" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="750" y="117" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">Agent 痛点：长历史拖垮吐字</text>
    <text x="750" y="135" fill="#78350f" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">上下文越长，每步 KV 读流量线性飙升</text>
    <text x="750" y="151" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">KV 占满显存后被迫缩小 Batch 降吞吐</text>

    <rect x="526" y="172" width="414" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="538" y="191" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">核心优化杠杆</text>
    <text x="538" y="209" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">• Continuous Batching（摊薄权重读取） • Speculative / MTP（一次验多 Token）</text>
    <text x="538" y="226" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">• GQA / MLA + FP8/NVFP4（压缩权重与 KV 搬运量） • CUDA Graph（消 CPU 税）</text>
  </g>

  <!-- Bottom Left: KV Cache Memory Ledger -->
  <g filter="url(#ip-shadow)">
    <rect x="24" y="270" width="540" height="218" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="24" y="270" width="540" height="32" rx="12" fill="#6d28d9"/>
    <rect x="24" y="290" width="540" height="12" fill="#6d28d9"/>
    <text x="294" y="291" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">KV Cache 显存账本演进：单 Token 体积压缩一个数量级</text>

    <text x="42" y="324" fill="#334155" font-family="Menlo,monospace" font-size="10.8" font-weight="700">KV_bytes / token = 2(K,V) × L(层数) × H_kv(KV头数) × d_head × precision</text>

    <!-- Bar 1: MHA -->
    <text x="42" y="352" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">MHA（每 Q 头独享 KV）</text>
    <rect x="200" y="339" width="290" height="18" rx="4" fill="#fecaca" stroke="#ef4444"/>
    <text x="498" y="352" fill="#991b1b" font-family="Menlo,monospace" font-size="10.5" font-weight="700">100% 基准</text>
    <text x="208" y="352" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">例：65B/70B 级 H_kv=64 · 128K 上下文可吃掉 &gt;300 GB</text>

    <!-- Bar 2: GQA -->
    <text x="42" y="388" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">GQA（多 Q 头共享 KV）</text>
    <rect x="200" y="375" width="96" height="18" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="304" y="388" fill="#1e3a8a" font-family="Menlo,monospace" font-size="10.5" font-weight="700">~12.5%（8× 压缩）</text>
    <text x="208" y="388" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">H_kv = 8</text>

    <!-- Bar 3: MLA -->
    <text x="42" y="424" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">MLA（低秩潜向量压缩）</text>
    <rect x="200" y="411" width="38" height="18" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="246" y="424" fill="#14532d" font-family="Menlo,monospace" font-size="10.5" font-weight="700">~3%–5%（DeepSeek-V3 仅存 d_c=512 + d_r=64）</text>

    <rect x="40" y="442" width="508" height="34" rx="7" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="52" y="463" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8">再叠加 FP8 / NVFP4 KV 量化与混合架构（SWA + Mamba/Linear），单卡并发上下文容量再翻 2–4×</text>
  </g>

  <!-- Bottom Right: Long Context Cliff & Context Rot -->
  <g filter="url(#ip-shadow)">
    <rect x="582" y="270" width="374" height="218" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
    <rect x="582" y="270" width="374" height="32" rx="12" fill="#b45309"/>
    <rect x="582" y="290" width="374" height="12" fill="#b45309"/>
    <text x="769" y="291" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">长上下文双悬崖：为何 200K 窗口仍需 Compaction</text>

    <rect x="598" y="314" width="342" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="610" y="333" fill="#991b1b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">1. 硬件成本悬崖（物理硬约束）</text>
    <text x="610" y="352" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.6">Prefill O(n²) 算力暴涨 + Decode 每步 KV 读流量线性膨胀</text>

    <rect x="598" y="374" width="342" height="52" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="610" y="393" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.2" font-weight="700">2. Context Rot 注意力稀释（有效窗口 &lt; 标称窗口）</text>
    <text x="610" y="412" fill="#78350f" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.6">RoPE 长距衰减 + 冗余工具日志淹没关键约束（中段迷失）</text>

    <rect x="598" y="434" width="342" height="42" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="610" y="452" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.8" font-weight="700">→ 倒逼上层 Agent 工程：75% 压缩线 / 吸收带 / 增量 Diff</text>
    <text x="610" y="468" fill="#166534" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.2">OpenClaw · Codex · OpenCode · Pi · DeepSeek Harness 共同根因</text>
  </g>
</svg>
