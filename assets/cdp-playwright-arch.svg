<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450" role="img" aria-label="CDP 与 Playwright 底层通信原理架构图">
  <defs>
    <linearGradient id="cdp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="cdp-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <filter id="cdp-shadow" x="-3%" y="-6%" width="106%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="980" height="450" rx="14" fill="url(#cdp-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">CDP + Playwright 底层工作原理：一条 WebSocket 接管浏览器内核</text>

  <!-- Layer 1: AI Agent -->
  <g filter="url(#cdp-shadow)">
    <rect x="28" y="56" width="924" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
    <rect x="28" y="56" width="150" height="58" rx="10" fill="#1e293b"/>
    <rect x="166" y="56" width="12" height="58" fill="#1e293b"/>
    <text x="103" y="90" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">AI Agent 工具层</text>
    <text x="200" y="90" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="600">高层语义意图：click(ref="e12") · fill(ref="e4", "...") · snapshot() · screenshot()</text>
  </g>

  <line x1="490" y1="114" x2="490" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#cdp-arr)"/>

  <!-- Layer 2: Playwright -->
  <g filter="url(#cdp-shadow)">
    <rect x="28" y="144" width="924" height="84" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
    <rect x="28" y="144" width="150" height="84" rx="10" fill="#2563eb"/>
    <rect x="166" y="144" width="12" height="84" fill="#2563eb"/>
    <text x="103" y="182" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">Playwright 编排层</text>
    <text x="103" y="201" text-anchor="middle" fill="#dbeafe" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">替你干所有脏活</text>

    <rect x="194" y="158" width="176" height="56" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="282" y="180" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">自动可操作性检查</text>
    <text x="282" y="199" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">可见 · 稳定 · 未遮挡</text>

    <rect x="382" y="158" width="176" height="56" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="470" y="180" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">BrowserContext 隔离</text>
    <text x="470" y="199" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">单进程多无痕环境</text>

    <rect x="570" y="158" width="176" height="56" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="658" y="180" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">Shadow / iframe 穿透</text>
    <text x="658" y="199" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">自动维护多 sessionId</text>

    <rect x="758" y="158" width="178" height="56" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="847" y="180" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">网络路由与下载托管</text>
    <text x="847" y="199" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">SSRF 拦截 · 录屏追踪</text>
  </g>

  <!-- Bidirectional WebSocket Pipe -->
  <line x1="490" y1="228" x2="490" y2="274" stroke="#2563eb" stroke-width="2.4" marker-end="url(#cdp-arr)" marker-start="url(#cdp-arr)"/>
  <rect x="276" y="239" width="428" height="24" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="490" y="255" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">CDP（Chrome DevTools Protocol）：单条 WebSocket 双向 JSON-RPC 2.0</text>

  <!-- Layer 3: Chromium Internals (6 CDP Domains) -->
  <g filter="url(#cdp-shadow)">
    <rect x="28" y="280" width="924" height="146" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
    <rect x="28" y="280" width="150" height="146" rx="10" fill="#0f766e"/>
    <rect x="166" y="280" width="12" height="146" fill="#0f766e"/>
    <text x="103" y="346" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">Chromium 内核</text>
    <text x="103" y="366" text-anchor="middle" fill="#ccfbf1" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">与 F12 同等上帝权限</text>

    <!-- 6 Domain Cards (2 rows x 3 cols) -->
    <rect x="194" y="294" width="238" height="54" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="208" y="314" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">Page 域</text>
    <text x="208" y="334" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">跳转 · 截屏 · PDF · 加载事件</text>

    <rect x="446" y="294" width="238" height="54" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="460" y="314" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">DOM &amp; Accessibility 域</text>
    <text x="460" y="334" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">拉取 DOM 树 / 完整无障碍树 AXTree</text>

    <rect x="698" y="294" width="238" height="54" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="712" y="314" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">Input 域</text>
    <text x="712" y="334" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">注入原生键鼠事件（isTrusted=true）</text>

    <rect x="194" y="358" width="238" height="54" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="208" y="378" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">Runtime 域</text>
    <text x="208" y="398" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">执行页面 JS · 实时捕获 Console/报错</text>

    <rect x="446" y="358" width="238" height="54" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="460" y="378" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">Network 域</text>
    <text x="460" y="398" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">拦截请求/响应 · 读写 Cookie · SSRF 过滤</text>

    <rect x="698" y="358" width="238" height="54" rx="7" fill="#ffffff" stroke="#86efac"/>
    <text x="712" y="378" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">Target 域</text>
    <text x="712" y="398" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">多 Tab / 弹窗 / 跨域 iframe 多路复用</text>
  </g>
</svg>
