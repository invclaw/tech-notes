<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="980" height="510" role="img" aria-label="OpenAI Codex 上下文压缩机制全景图">
  <defs>
    <linearGradient id="cc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="cc-arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="cc-arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <filter id="cc-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="980" height="510" rx="14" fill="url(#cc-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">Codex 上下文压缩架构：三条压缩路线 · 后台投机预压 · 五层窗口重建</text>

  <!-- Column 1: Triggers & 3 Compaction Paths -->
  <rect x="24" y="54" width="292" height="432" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="24" y="54" width="292" height="30" rx="12" fill="#1e293b"/>
  <rect x="24" y="72" width="292" height="12" fill="#1e293b"/>
  <text x="170" y="74" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">一、触发与三条压缩路线</text>

  <g filter="url(#cc-shadow)">
    <rect x="38" y="98" width="264" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="50" y="118" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">触发时机（均走 Pre/PostCompact 钩子）</text>
    <text x="50" y="138" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 手动 /compact · 行内自动 · 回合后自动</text>
    <text x="50" y="153" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 撞窗口上限溢出的紧急压缩补救</text>
  </g>

  <g filter="url(#cc-shadow)">
    <rect x="38" y="174" width="264" height="96" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="50" y="195" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">路线 A：远端压缩 V2（主力）</text>
    <text x="50" y="215" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 调 Responses 服务端生成结构化压缩态</text>
    <text x="50" y="233" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 支持后台投机预压缩（零卡顿秒装）</text>
    <text x="50" y="251" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 保留最近消息预算高达 64K tokens</text>
  </g>

  <g filter="url(#cc-shadow)">
    <rect x="38" y="284" width="264" height="96" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.4"/>
    <text x="50" y="305" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">路线 B：本地模型摘要压缩</text>
    <text x="50" y="325" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 发摘要提示词生成结构化交接总结</text>
    <text x="50" y="343" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 压缩自身溢出时逐条裁最老记录重试</text>
    <text x="50" y="361" fill="#15803d" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 保留最近用户消息上限 20K tokens</text>
  </g>

  <g filter="url(#cc-shadow)">
    <rect x="38" y="394" width="264" height="78" rx="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="50" y="415" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">路线 C：令牌预算直接开新窗</text>
    <text x="50" y="435" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 跳过模型/服务端总结，零推理开销</text>
    <text x="50" y="453" fill="#7c3aed" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 保持完全一致的钩子与生命周期事件</text>
  </g>

  <!-- Arrow Col 1 -> Col 2 -->
  <line x1="316" y1="224" x2="348" y2="224" stroke="#2563eb" stroke-width="2" marker-end="url(#cc-arr-blue)"/>

  <!-- Column 2: Speculative Background + Safety Check -->
  <rect x="354" y="54" width="272" height="432" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="354" y="54" width="272" height="30" rx="12" fill="#2563eb"/>
  <rect x="354" y="72" width="272" height="12" fill="#2563eb"/>
  <text x="490" y="74" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">二、后台投机预压与容错</text>

  <g filter="url(#cc-shadow)">
    <rect x="368" y="102" width="244" height="124" rx="9" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="380" y="124" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">1. 后台提前预压前缀</text>
    <text x="380" y="145" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 接近阈值时截取历史前缀异步压缩</text>
    <text x="380" y="164" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 不阻塞用户当前正在进行的对话</text>
    <text x="380" y="183" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 产物存为后台候选（含模型哈希）</text>
    <text x="380" y="206" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">⚡ 真正触线时直接采纳，免漫长等待</text>
  </g>

  <line x1="490" y1="226" x2="490" y2="250" stroke="#2563eb" stroke-width="2" marker-end="url(#cc-arr-blue)"/>

  <g filter="url(#cc-shadow)">
    <rect x="368" y="256" width="244" height="114" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="380" y="278" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">2. 采纳校验与前台兜底</text>
    <text x="380" y="299" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 核对模型 slug 与配置哈希是否变化</text>
    <text x="380" y="318" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 拼接新产生的尾巴后再查是否超预算</text>
    <text x="380" y="337" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 若仍超预算或候选失效→无缝回退</text>
    <text x="380" y="356" fill="#b45309" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">  触发一次前台同步压缩兜底</text>
  </g>

  <line x1="490" y1="370" x2="490" y2="394" stroke="#0f766e" stroke-width="2" marker-end="url(#cc-arr-teal)"/>

  <g filter="url(#cc-shadow)">
    <rect x="368" y="400" width="244" height="72" rx="9" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.4"/>
    <text x="380" y="422" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">3. 原子替换与落盘一致</text>
    <text x="380" y="443" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 补齐 Item ID + 递增窗口编号</text>
    <text x="380" y="460" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">• 内存历史与 Rollout 落盘字节级一致</text>
  </g>

  <!-- Arrow Col 2 -> Col 3 -->
  <line x1="626" y1="270" x2="658" y2="270" stroke="#0f766e" stroke-width="2" marker-end="url(#cc-arr-teal)"/>

  <!-- Column 3: Rebuilt Context Window -->
  <rect x="664" y="54" width="292" height="432" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="664" y="54" width="292" height="30" rx="12" fill="#0f766e"/>
  <rect x="664" y="72" width="292" height="12" fill="#0f766e"/>
  <text x="810" y="74" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">三、新上下文窗口的五层拼装</text>

  <g filter="url(#cc-shadow)">
    <rect x="678" y="98" width="264" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="690" y="119" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">① 稳定前缀（保 Prompt Cache）</text>
    <text x="690" y="139" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">基础指令与不变前缀置顶，提高缓存命中</text>
  </g>

  <g filter="url(#cc-shadow)">
    <rect x="678" y="170" width="264" height="62" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="690" y="191" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">② 最新 World State 重新渲染</text>
    <text x="690" y="211" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">工作区、工具与环境全按当前最新重算</text>
  </g>

  <g filter="url(#cc-shadow)">
    <rect x="678" y="244" width="264" height="66" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="690" y="265" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">③ 压缩摘要 / 服务端压缩态</text>
    <text x="690" y="285" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">替代早期海量对话与工具过程日志</text>
    <text x="690" y="300" fill="#2563eb" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">（精确插在未处理新消息之前）</text>
  </g>

  <g filter="url(#cc-shadow)">
    <rect x="678" y="322" width="264" height="68" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="690" y="343" fill="#92400e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">④ 跨窗口硬保留物</text>
    <text x="690" y="363" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 近期真实用户消息（20K/64K 预算内）</text>
    <text x="690" y="380" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">• 标记跨窗保留的独立工具输出与媒体预算</text>
  </g>

  <g filter="url(#cc-shadow)">
    <rect x="678" y="402" width="264" height="70" rx="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="690" y="423" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">⑤ 挂起未处理输入（Pending Mail）</text>
    <text x="690" y="443" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">压缩瞬间刚到达的新输入按原序归位</text>
    <text x="690" y="460" fill="#7c3aed" font-family="-apple-system,PingFang SC,sans-serif" font-size="10.5">确保每条输入只出现一次、绝不被吞掉</text>
  </g>
</svg>
