<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="技术知识体系化沉淀工作流">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="880" height="240" rx="14" fill="url(#bg)" stroke="#dbeafe" stroke-width="1.5"/>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="28" y="48" width="176" height="144" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="28" y="48" width="176" height="32" rx="12" fill="#1e293b"/>
    <rect x="28" y="68" width="176" height="12" fill="#1e293b"/>
    <text x="116" y="69" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">1. 输入项目与初稿</text>
    <text x="116" y="106" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5">代码仓库 / 原始知识稿</text>
    <text x="116" y="130" text-anchor="middle" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">快速建立全局认知</text>
    <text x="116" y="150" text-anchor="middle" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">理清模块边界与主链路</text>
    <text x="116" y="176" text-anchor="middle" fill="#2563eb" font-family="Menlo,monospace" font-size="11">Repo / Notes</text>
  </g>

  <line x1="204" y1="120" x2="244" y2="120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="252" y="48" width="184" height="144" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="1.6"/>
    <rect x="252" y="48" width="184" height="32" rx="12" fill="#2563eb"/>
    <rect x="252" y="68" width="184" height="12" fill="#2563eb"/>
    <text x="344" y="69" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">2. 反复沟通关键细节</text>
    <text x="344" y="106" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="600">聚焦真正的难点与重点</text>
    <text x="344" y="130" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">纠偏初始理解误差</text>
    <text x="344" y="150" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">深挖实现原理与边界条件</text>
    <text x="344" y="176" text-anchor="middle" fill="#2563eb" font-family="Menlo,monospace" font-size="11">Iterative Q&amp;A</text>
  </g>

  <line x1="436" y1="120" x2="476" y2="120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="484" y="48" width="176" height="144" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="484" y="48" width="176" height="32" rx="12" fill="#0f766e"/>
    <rect x="484" y="68" width="176" height="12" fill="#0f766e"/>
    <text x="572" y="69" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">3. 体系化图文沉淀</text>
    <text x="572" y="106" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5">结构化拆解 + 图文并茂</text>
    <text x="572" y="130" text-anchor="middle" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">Mermaid 架构 / 时序图</text>
    <text x="572" y="150" text-anchor="middle" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">重点结论与避坑高亮卡片</text>
    <text x="572" y="176" text-anchor="middle" fill="#0f766e" font-family="Menlo,monospace" font-size="11">Markdown + SVG</text>
  </g>

  <line x1="660" y1="120" x2="700" y2="120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="708" y="48" width="144" height="144" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="708" y="48" width="144" height="32" rx="12" fill="#4f46e5"/>
    <rect x="708" y="68" width="144" height="12" fill="#4f46e5"/>
    <text x="780" y="69" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">4. 公网发布</text>
    <text x="780" y="106" text-anchor="middle" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5">持续公开迭代</text>
    <text x="780" y="130" text-anchor="middle" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">随时检索与分享</text>
    <text x="780" y="150" text-anchor="middle" fill="#64748b" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">多项目长期复用</text>
    <text x="780" y="176" text-anchor="middle" fill="#4f46e5" font-family="Menlo,monospace" font-size="11">:8080 Live</text>
  </g>
</svg>
