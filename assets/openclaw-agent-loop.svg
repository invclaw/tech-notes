<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="OpenClaw Agent Loop 三层嵌套循环架构图">
  <defs>
    <linearGradient id="al-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <filter id="al-shadow" x="-3%" y="-5%" width="106%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="980" height="600" rx="14" fill="url(#al-bg)" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="490" y="34" text-anchor="middle" fill="#0f172a" font-family="-apple-system,PingFang SC,sans-serif" font-size="16.5" font-weight="700">OpenClaw Agent Loop：三层嵌套循环架构</text>

  <!-- ==================== LOOP 1: OUTER ==================== -->
  <g filter="url(#al-shadow)">
    <rect x="24" y="52" width="932" height="524" rx="14" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 4"/>
    <rect x="40" y="62" width="308" height="26" rx="6" fill="#7c3aed"/>
    <text x="194" y="79" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">第 1 层（外循环）：Run 级收尾兜底循环</text>
    <text x="362" y="79" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">兜底 FollowUp 队列与收尾瞬间的最终 Steer，防止遗弃已接纳输入</text>
  </g>

  <!-- ==================== LOOP 2: MIDDLE (CORE) ==================== -->
  <g filter="url(#al-shadow)">
    <rect x="64" y="102" width="844" height="368" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="80" y="112" width="334" height="26" rx="6" fill="#2563eb"/>
    <text x="247" y="129" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">第 2 层（核心循环）：推理 ↔ 工具 ↔ 插话主循环</text>
    <text x="428" y="129" fill="#1e40af" font-family="-apple-system,PingFang SC,sans-serif" font-size="12">驱动多轮模型推理、工具结算、终止裁决与 Steer 注入</text>
  </g>

  <!-- Step boxes in L2 top row -->
  <g filter="url(#al-shadow)">
    <rect x="92" y="152" width="182" height="62" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
    <text x="183" y="176" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">① 注入待处理输入</text>
    <text x="183" y="197" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">新消息 / 插话 Steer</text>
  </g>

  <line x1="274" y1="183" x2="314" y2="183" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <g filter="url(#al-shadow)">
    <rect x="322" y="152" width="214" height="62" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
    <text x="429" y="176" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">② 模型流式推理</text>
    <text x="429" y="197" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">产出文本 / 工具计划 / 终止信号</text>
  </g>

  <line x1="536" y1="183" x2="578" y2="183" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <g filter="url(#al-shadow)">
    <rect x="586" y="152" width="298" height="62" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
    <text x="735" y="176" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">③ 终止与续跑裁决</text>
    <text x="735" y="197" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">模型说结束？工具提前终结？有 Steer？</text>
  </g>

  <!-- Arrow from ② down into L3 -->
  <line x1="429" y1="214" x2="429" y2="246" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-teal)"/>
  <text x="439" y="235" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="600">若包含工具调用</text>

  <!-- ==================== LOOP 3: INNER (TOOL EXECUTION) ==================== -->
  <g filter="url(#al-shadow)">
    <rect x="136" y="254" width="704" height="142" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
    <rect x="152" y="264" width="318" height="24" rx="5" fill="#0f766e"/>
    <text x="311" y="280" text-anchor="middle" fill="#ffffff" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">第 3 层（工具内循环）：单次回复的多工具调度</text>
    <text x="482" y="280" fill="#115e59" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">按串/并行跑完工具并保持调用-结果严格配对</text>

    <!-- Serial branch -->
    <rect x="154" y="300" width="326" height="80" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.3"/>
    <text x="168" y="320" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">串行模式（逐个执行 + 边界查 Steer）</text>
    <text x="168" y="341" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">• 跑完工具 i → 检查是否有 Steer 等待</text>
    <text x="168" y="361" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">• 有 Steer：跳过未开始尾巴 + 补配对结果</text>

    <!-- Parallel branch -->
    <rect x="496" y="300" width="326" height="80" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.3"/>
    <text x="510" y="320" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="700">并行模式（整批并发 + 统一结算）</text>
    <text x="510" y="341" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">• 整批同时发车，不中途跳过</text>
    <text x="510" y="361" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">• 全部完成后汇总结果交回第 2 层</text>
  </g>

  <!-- Arrow from L3 up to ③ -->
  <line x1="704" y1="254" x2="704" y2="220" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-teal)"/>
  <text x="714" y="239" fill="#0f766e" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="600">返回工具结果</text>

  <!-- L2 Back-edge cleanly routed outside L3 (right margin x=868 -> bottom y=428 -> left margin x=106 -> up to ①) -->
  <path d="M 868 214 L 868 428 L 106 428 L 106 220" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <rect x="266" y="411" width="444" height="34" rx="7" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="488" y="432" text-anchor="middle" fill="#1e3a8a" font-family="-apple-system,PingFang SC,sans-serif" font-size="12" font-weight="600">L2 回边：工具未终结 / 模型声明未说完 / 收到 Steer → 继续下一轮</text>

  <!-- Hard stop bypass on right outside L2 -->
  <path d="M 884 183 L 934 183 L 934 527 L 870 527" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-red)"/>
  <rect x="912" y="284" width="38" height="90" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="931" y="305" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">硬</text>
  <text x="931" y="322" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">中</text>
  <text x="931" y="339" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="700">止</text>
  <text x="931" y="359" text-anchor="middle" fill="#b91c1c" font-family="-apple-system,PingFang SC,sans-serif" font-size="10">直退</text>

  <!-- Exit from L2 down to L1 outer check -->
  <line x1="488" y1="470" x2="488" y2="494" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-purple)"/>
  <text x="500" y="487" fill="#6d28d9" font-family="-apple-system,PingFang SC,sans-serif" font-size="11" font-weight="600">无需续跑且无待处理 Steer → 退出第 2 层</text>

  <!-- L1 Bottom Outer Check -->
  <g filter="url(#al-shadow)">
    <rect x="276" y="500" width="424" height="54" rx="9" fill="#ffffff" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="488" y="522" text-anchor="middle" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="12.5" font-weight="700">外层最终复查（防遗弃）</text>
    <text x="488" y="542" text-anchor="middle" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5">① 检查 FollowUp 队列 → ② 若空，再复查一次最终 Steer</text>
  </g>

  <!-- L1 Back-edge (Purple) cleanly outside L2 -->
  <path d="M 276 527 L 44 527 L 44 183 L 86 183" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arr-purple)"/>
  <rect x="64" y="504" width="194" height="46" rx="7" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="161" y="523" text-anchor="middle" fill="#5b21b6" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="600">L1 回边：仍有新输入</text>
  <text x="161" y="541" text-anchor="middle" fill="#6d28d9" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">重新拉回第 2 层继续跑</text>

  <!-- Final Exit (Green) -->
  <line x1="700" y1="527" x2="748" y2="527" stroke="#15803d" stroke-width="2.2" marker-end="url(#arr-green)"/>
  <g filter="url(#al-shadow)">
    <rect x="754" y="500" width="110" height="54" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/>
    <text x="809" y="523" text-anchor="middle" fill="#14532d" font-family="-apple-system,PingFang SC,sans-serif" font-size="13" font-weight="700">正式结束</text>
    <text x="809" y="542" text-anchor="middle" fill="#166534" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">全部清空</text>
  </g>
</svg>
