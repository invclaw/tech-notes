    <text x="792" y="154" fill="#7f1d1d" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">代表技术</text>
    <text x="792" y="173" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">Firecracker · QEMU</text>
