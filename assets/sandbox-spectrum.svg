    <text x="36" y="190" fill="#334155" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">V8 Isolate · Pyodide</text>
    <text x="36" y="218" fill="#065f46" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">隔离边界</text>
