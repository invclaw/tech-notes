    <text x="603" y="284" fill="#475569" font-family="-apple-system,PingFang SC,sans-serif" font-size="11">数百毫秒 ～ 2 秒</text>
    <text x="603" y="312" fill="#4c1d95" font-family="-apple-system,PingFang SC,sans-serif" font-size="11.5" font-weight="700">典型场景</text>
